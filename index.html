<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF-TECH Operations Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef3f6;--surface:#fff;--ink:#10222e;--muted:#52667a;--line:#cfdbe3;--teal:#0f766e;--teal-ink:#fff;--amber:#d97706;--red:#b91c1c;--track:#dbe6ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a22;--surface:#142632;--ink:#e8f1f6;--muted:#9bb0bf;--line:#264152;--teal:#2dd4bf;--teal-ink:#06231f;--amber:#fbbf24;--red:#f87171;--track:#21394a;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;font-size:16px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px;flex-wrap:wrap;gap:8px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{font:inherit;font-weight:600;border:2px solid transparent;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--teal);color:var(--teal-ink)}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k2{grid-template-columns:1fr 1fr}.k5{grid-template-columns:repeat(5,minmax(150px,1fr))}
@media (max-width:860px){.k4,.k2{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.k4,.k2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin-bottom:14px}
.kpi b{display:block;font-size:1.6rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.9rem}
.bar{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar i.w{background:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
button.s,select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:5px 10px}
button.s{cursor:pointer;font-weight:600}
button.p{font:inherit;font-weight:700;background:var(--teal);color:var(--teal-ink);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.badge{font-size:.8rem;font-weight:700;border-radius:6px;padding:2px 8px;border:1.5px solid currentColor;white-space:nowrap}
.ok{color:var(--teal)}.warn{color:var(--amber)}.bad{color:var(--red)}
form.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
form.add input{flex:1;min-width:140px}
.lead{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg);font-size:.9rem}
.lead small{color:var(--muted);display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
.toast.on{opacity:1}
.pre{white-space:pre-wrap}
</style>
</head>
<body>

<section id="login" hidden style="max-width:380px;margin:12vh auto;padding:0 18px">
  <div class="card">
    <h2>Sign in</h2>
    <p class="sub">Staff accounts only.</p>
    <form onsubmit="signIn(event)" class="grid" style="gap:10px">
      <input type="email" id="lg-email" placeholder="Email" aria-label="Email" required autocomplete="username">
      <input type="password" id="lg-pass" placeholder="Password" aria-label="Password" required autocomplete="current-password">
      <button class="p" id="lg-btn">Sign in</button>
    </form>
    <p id="lg-err" class="bad" role="alert"></p>
  </div>
</section>

<div class="wrap" id="app" hidden>
  <header>
    <h1>SAF-TECH Operations Console</h1>
    <div><span id="who" class="sub" style="margin:0 12px 0 0"></span><button class="s" onclick="signOut()">Sign out</button></div>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const SB_URL = "https://rjzeqptfwxzhuofsbamc.supabase.co";
const SB_KEY = "sb_publishable_KlijfrZpv4RGZZOTzgL3ag_q4Gpf0wU";
const db = supabase.createClient(SB_URL, SB_KEY);

const TABS = ["Overview","Leads","Goals","Marketing","Customers","Login details","Tertiary info","Billing","Messages","AI assistant"];
const CS = ["Onboarding","Active","Upsell","At risk"];
const LS = ["New","Contacted","Site survey","Quoted","Won"];
const NEXT = {"Onboarding":"Confirm install and Wi-Fi setup","Active":"Check-in call at 90 days","Upsell":"Offer a faster plan","At risk":"Call within 48 hours"};
const MO = ["Jun 2026","Jul 2026","Aug 2026","Sep 2026","Oct 2026","Nov 2026"];
const TPL = {
  "Billing reminder":"Hello {name}, your {package} bill of {amount} is due. Please pay before the due date to avoid disconnection. Thank you, SAF-TECH.",
  "Service outage":"Hello {name}, we are fixing a network fault in your area and service will be restored shortly. We apologize for the inconvenience. SAF-TECH.",
  "Upgrade offer":"Hello {name}, upgrade from {package} to a faster package this month and get your first week free. Reply YES to upgrade. SAF-TECH.",
  "Welcome":"Welcome to SAF-TECH, {name}! Your {package} package is being set up and our technician will contact you shortly."
};
const TF = [["Location","location","text","Area or street"],["ID number","national_id","text","National ID"],["Alternate contact","alternate_contact","text","Name and phone"],["Installed on","installed_on","date",""],["Equipment serial","equipment_serial","text","Router or ONT serial"],["Notes","notes","text","Anything else"]];

let S = {pk:{},cust:[],leads:[],inv:[],pays:[],msgs:[],goals:[],mk:[],actions:[],summaries:[]};
let tab = "Overview", BM = "Oct 2026", SH = false, dc = 0;
let M = {aud:"all", ch:"SMS", txt:TPL["Service outage"]};
let AI = {summary:"", scope:"Overall operations", note:""};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "KSh " + Math.round(n || 0).toLocaleString("en-US");
const today = () => new Date().toISOString().slice(0,10);
const rnd = (len, chars) => { let s=""; for(let i=0;i<len;i++) s+=chars.charAt(Math.floor(Math.random()*chars.length)); return s; };
const price = c => S.pk[c.package] || 0;
const cust = id => S.cust.find(c => c.id === id) || {name:"Unknown", package:"Bronze"};
const paid = inv => S.pays.filter(p => p.invoice_id === inv.id).reduce((a,p) => a + p.amount, 0);
const invPrice = inv => price(cust(inv.customer_id));
const status = inv => { const p = paid(inv), pr = invPrice(inv); return p >= pr ? "Paid" : p > 0 ? "Partial" : inv.status; };
const bcls = s => s === "Paid" ? "ok" : s === "Overdue" ? "bad" : "warn";
const fdate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}) : "-";
const invFor = (cid, m) => S.inv.find(i => i.customer_id === cid && i.billing_month === m);

function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(window._tt); window._tt=setTimeout(()=>e.classList.remove("on"),2200); }

async function run(promise, msg){
  const {error} = await promise;
  if (error) { toast(error.message); return false; }
  if (msg) toast(msg);
  await load(); render();
  return true;
}

async function load(){
  const [pk,cu,le,iv,pa,me,go,mk,ac,su] = await Promise.all([
    db.from("packages").select("*"),
    db.from("customers").select("*").order("id"),
    db.from("leads").select("*").order("id"),
    db.from("invoices").select("*").order("id"),
    db.from("payments").select("*").order("id"),
    db.from("messages").select("*").order("sent_at",{ascending:false}).limit(50),
    db.from("goals").select("*").order("id"),
    db.from("marketing_channels").select("*").order("id"),
    db.from("ai_actions").select("*").order("created_at",{ascending:false}).limit(20),
    db.from("ai_summaries").select("*").order("created_at",{ascending:false}).limit(5)
  ]);
  const bad = [pk,cu,le,iv,pa,me,go,mk,ac,su].find(r => r.error);
  if (bad) throw bad.error;
  S = {
    pk: Object.fromEntries(pk.data.map(p => [p.name, p.monthly_price])),
    cust: cu.data, leads: le.data, inv: iv.data, pays: pa.data,
    msgs: me.data, goals: go.data, mk: mk.data, actions: ac.data, summaries: su.data
  };
}

function go(t){ tab = t; render(); }

function render(){
  $("#tabs").innerHTML = TABS.map(t => `<button role="tab" aria-selected="${t===tab}" onclick="go('${t}')">${t}</button>`).join("");
  $("#view").innerHTML = V[tab]();
}

const V = {};

V["Overview"] = () => {
  const mrr = S.cust.reduce((a,c) => a + price(c), 0);
  const outstanding = S.inv.reduce((a,i) => a + Math.max(0, invPrice(i) - paid(i)), 0);
  const counts = CS.map(s => `<div class="card kpi"><span>${s}</span><b>${S.cust.filter(c=>c.stage===s).length}</b></div>`).join("");
  const seed = S.cust.length === 0 ? `<div class="card"><b>No customer data yet.</b><p class="sub">Load the sample customers, leads, goals and marketing data to try the console.</p><button class="p" onclick="loadSample()">Load sample data</button></div>` : "";
  return `<h2>System analytics</h2><p class="sub">Live figures from the database.</p>${seed}
  <div class="grid k4"><div class="card kpi"><span>Customers</span><b>${S.cust.length}</b></div><div class="card kpi"><span>Monthly recurring revenue</span><b>${money(mrr)}</b></div><div class="card kpi"><span>Outstanding</span><b>${money(outstanding)}</b></div><div class="card kpi"><span>Open leads</span><b>${S.leads.filter(l=>l.stage<4).length}</b></div></div>
  <div class="grid k4" style="margin-top:14px">${counts}</div>`;
};

V["Leads"] = () => `<h2>Customer leads</h2><p class="sub">Move each lead along the pipeline. A lead marked Won becomes a customer.</p>
<form class="add card" onsubmit="addLead(event)"><input id="ln" placeholder="Lead name" aria-label="Lead name" required>
<select id="ls" aria-label="Source">${["Referral","Social media","Door-to-door","Radio","Google ads","Partnership"].map(o=>`<option>${o}</option>`).join("")}</select>
<select id="lp" aria-label="Plan">${Object.keys(S.pk).map(o=>`<option>${o}</option>`).join("")}</select><button class="p">Add lead</button></form>
<div class="grid k5 scroll">${LS.map((st,i)=>{const L=S.leads.filter(l=>l.stage===i);return `<div class="card"><h3 style="font-size:.95rem;margin:0 0 8px">${st} (${L.length})</h3>${L.map(l=>`<div class="lead"><b>${esc(l.name)}</b><small>${esc(l.source)} · ${esc(l.package)}</small>${i<4?`<button class="s" onclick="moveLead(${l.id})">Move to ${LS[i+1]}</button>`:'<span class="ok">Customer</span>'}</div>`).join("")}</div>`}).join("")}</div>`;

V["Goals"] = () => `<h2>Company goals</h2><p class="sub">Update the current value as results come in.</p><div class="grid">${S.goals.map(g=>{
  let p = g.lower_is_better ? (g.target_value / g.current_value) * 100 : g.minimum_value != null ? (g.current_value - g.minimum_value)/(g.target_value - g.minimum_value)*100 : g.current_value/g.target_value*100;
  p = Math.max(0, Math.min(100, p));
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(g.title)}</b><span>Target: ${g.unit==="KSh"?"KSh ":""}${Number(g.target_value).toLocaleString("en-US")}${g.unit==="%"?"%":""}</span></div><div class="bar" style="margin:10px 0"><i class="${p<60?"w":""}" style="width:${p}%"></i></div><label>Current: <input type="number" step="any" value="${g.current_value}" style="width:130px" onchange="setGoal(${g.id},this.value)"></label> <span class="${p>=90?"ok":"warn"}">${Math.round(p)}% there</span></div>`}).join("")}</div>`;

V["Marketing"] = () => {
  const best = S.mk.filter(t=>t.customers>0).sort((a,b)=>a.spend/a.customers - b.spend/b.customers)[0];
  const mx = Math.max(1, ...S.mk.map(t=>t.customers));
  return `<h2>Marketing methods</h2><p class="sub">Monthly spend and results per channel. The lowest cost per customer is highlighted.</p>
  <div class="card scroll"><table><tr><th>Method</th><th>How we do it</th><th>Spend</th><th>Leads</th><th>Customers</th><th>Cost per customer</th></tr>
  ${S.mk.map(t=>`<tr${t===best?' style="background:var(--track)"':""}><td><b>${esc(t.name)}</b></td><td>${esc(t.description)}</td><td>${money(t.spend)}</td><td>${t.leads}</td><td>${t.customers}</td><td>${t.customers?money(t.spend/t.customers):"-"}</td></tr>`).join("")}</table></div>
  <div class="card"><h2 style="font-size:1.05rem">Customers won by method</h2>${S.mk.map(t=>`<div style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem"><span style="width:160px">${esc(t.name)}</span><div class="bar" style="flex:1"><i style="width:${t.customers/mx*100}%"></i></div><span>${t.customers}</span></div>`).join("")}</div>`;
};

V["Customers"] = () => {
  const counts = CS.map(s => `<div class="card kpi"><span>${s}</span><b>${S.cust.filter(c=>c.stage===s).length}</b></div>`).join("");
  return `<h2>Customer development</h2><p class="sub">Track every customer from install to upgrade, and spot who needs a call.</p>
  <div class="grid k4" style="margin-bottom:14px">${counts}</div>
  <form class="add card" onsubmit="addCustomer(event)"><b style="width:100%">Add a customer</b>
  <input id="cn" placeholder="Customer name" aria-label="Customer name" required>
  <input id="cph" type="tel" placeholder="Phone, e.g. 0712 345 678" aria-label="Phone" required>
  <input id="cem" type="email" placeholder="Email (optional)" aria-label="Email">
  <select id="cp" aria-label="Package">${Object.keys(S.pk).map(k=>`<option>${k}</option>`).join("")}</select>
  <select id="cs" aria-label="Service"><option>PPPoE</option><option>Hotspot</option></select><button class="p">Add customer</button></form>
  <div class="card scroll"><table><tr><th>Customer</th><th>Contact</th><th>Package</th><th>Service</th><th>Stage</th><th>Last contact</th><th>Next step</th><th></th></tr>
  ${S.cust.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||"-")}${c.email?`<br><small>${esc(c.email)}</small>`:""}</td><td>${c.package} · ${money(price(c))}</td><td><span class="badge ok">${c.service}</span></td>
  <td><select aria-label="Stage for ${esc(c.name)}" onchange="setField('customers',${c.id},'stage',this.value)">${CS.map(s=>`<option${s===c.stage?" selected":""}>${s}</option>`).join("")}</select></td>
  <td>${fdate(c.last_contact)}</td><td>${NEXT[c.stage]}</td>
  <td><button class="s" onclick="logContact(${c.id})">Log contact</button> <button class="s bad" onclick="delCustomer(${c.id})">${dc===c.id?"Confirm delete":"Delete"}</button></td></tr>`).join("")}</table></div>`;
};

V["Login details"] = () => `<h2>Login details</h2><p class="sub">PPPoE usernames and passwords, or hotspot voucher codes. Edit a field and it saves automatically.</p>
<p><button class="s" onclick="SH=!SH;render()">${SH?"Hide":"Show"} passwords</button></p>
<div class="card scroll"><table><tr><th>Customer</th><th>Service</th><th>Username</th><th>Password</th><th></th></tr>
${S.cust.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="badge ok">${c.service}</span></td>
<td><input value="${esc(c.pppoe_username||"")}" aria-label="Username for ${esc(c.name)}" onchange="setField('customers',${c.id},'pppoe_username',this.value)"></td>
<td><input type="${SH?"text":"password"}" value="${esc(c.pppoe_password||"")}" aria-label="Password for ${esc(c.name)}" onchange="setField('customers',${c.id},'pppoe_password',this.value)"></td>
<td><button class="s" onclick="newLogin(${c.id})">${c.pppoe_password?"New password":"Generate"}</button></td></tr>`).join("")}</table></div>`;

V["Tertiary info"] = () => `<h2>Tertiary information</h2><p class="sub">Extra details kept on each customer. Edit a field and it saves automatically.</p>
<div class="card scroll"><table><tr><th>Customer</th>${TF.map(f=>`<th>${f[0]}</th>`).join("")}</tr>
${S.cust.map(c=>`<tr><td><b>${esc(c.name)}</b></td>${TF.map(f=>`<td><input type="${f[2]}" value="${esc(c[f[1]]||"")}" placeholder="${f[3]}" aria-label="${f[0]} for ${esc(c.name)}" onchange="setField('customers',${c.id},'${f[1]}',this.value)" style="min-width:140px"></td>`).join("")}</tr>`).join("")}</table></div>`;

V["Billing"] = () => {
  const I = S.inv.filter(i => i.billing_month === BM);
  let billed=0, collected=0, overdue=0;
  I.forEach(i => { const p=invPrice(i), q=Math.min(p,paid(i)); billed+=p; collected+=q; if(status(i)==="Overdue") overdue+=p-q; });
  const history = S.pays.slice().reverse().slice(0,15);
  const mo = MO.map(m=>`<option${m===BM?" selected":""}>${m}</option>`).join("");
  return `<h2>Billing</h2><p class="sub">Record each payment against a customer and a month.</p>
  <p><label>Month <select onchange="BM=this.value;render()">${mo}</select></label> <button class="s" onclick="genInvoices()">Generate invoices for ${BM}</button></p>
  <div class="grid k4" style="margin-bottom:14px"><div class="card kpi"><span>Billed in ${BM}</span><b>${money(billed)}</b></div><div class="card kpi"><span>Collected</span><b class="ok">${money(collected)}</b></div><div class="card kpi"><span>Outstanding</span><b>${money(billed-collected)}</b></div><div class="card kpi"><span>Overdue</span><b class="bad">${money(overdue)}</b></div></div>
  <form class="add card" onsubmit="recordPay(event)"><b style="width:100%">Record a payment</b>
  <select id="bc" aria-label="Customer">${S.cust.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
  <select id="bm" aria-label="Month paid for">${mo}</select>
  <input id="bd" type="date" value="${today()}" aria-label="Date paid" required>
  <input id="ba" type="number" min="1" placeholder="Amount (blank = full balance)" aria-label="Amount" style="min-width:220px">
  <select id="bp" aria-label="Method"><option>Mobile money</option><option>Cash</option><option>Bank transfer</option></select><button class="p">Record payment</button></form>
  <div class="card scroll"><h2 style="font-size:1.05rem">Invoices for ${BM}</h2><table><tr><th>Customer</th><th>Plan</th><th>Billed</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>
  ${I.length ? I.map(i=>{const c=cust(i.customer_id),p=invPrice(i),q=paid(i),s=status(i);return `<tr><td><b>${esc(c.name)}</b></td><td>${c.package}</td><td>${money(p)}</td><td>${money(q)}</td><td>${money(Math.max(0,p-q))}</td><td><span class="badge ${bcls(s)}">${s}</span></td><td>${s==="Paid"?"":`<button class="s" onclick="markPaid(${i.id})">Mark paid in full</button>`}</td></tr>`}).join("") : `<tr><td colspan="7">No invoices for this month. Use Generate invoices.</td></tr>`}</table></div>
  <div class="card scroll"><h2 style="font-size:1.05rem">Payment history</h2><table><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Method</th></tr>
  ${history.length ? history.map(p=>{const inv=S.inv.find(i=>i.id===p.invoice_id);return `<tr><td>${fdate(p.paid_on)}</td><td>${inv?esc(cust(inv.customer_id).name):"-"}</td><td>${money(p.amount)}</td><td>${p.method}</td></tr>`}).join("") : `<tr><td colspan="4">No payments recorded yet.</td></tr>`}</table></div>`;
};

const AUD = () => [["all","All customers"], ...CS.map(s=>["st:"+s,"Stage: "+s]), ...Object.keys(S.pk).map(p=>["pl:"+p,"Package: "+p]), ["sv:PPPoE","Service: PPPoE"], ["sv:Hotspot","Service: Hotspot"], ["unpaid","Customers with unpaid invoices"]];
function recips(){
  const a = M.aud;
  return S.cust.filter(c => {
    if (a==="all") return true;
    const [k,v] = a.split(":");
    if (k==="st") return c.stage===v;
    if (k==="pl") return c.package===v;
    if (k==="sv") return c.service===v;
    return S.inv.some(i => i.customer_id===c.id && status(i)!=="Paid");
  });
}
const fill = (t,c) => t.split("{name}").join(c.name.split(" ")[0]).split("{package}").join(c.package).split("{amount}").join(money(price(c)));
V["Messages"] = () => {
  const r = recips();
  return `<h2>Messages</h2><p class="sub">Send an SMS or WhatsApp message to a group. Type {name}, {package} or {amount} to personalize.</p>
  <div class="grid k2"><div class="card"><div class="grid" style="gap:12px">
  <label>Send to<br><select style="width:100%" onchange="M.aud=this.value;render()">${AUD().map(o=>`<option value="${o[0]}"${o[0]===M.aud?" selected":""}>${o[1]}</option>`).join("")}</select></label>
  <label>Channel<br><select style="width:100%" onchange="M.ch=this.value;render()">${["SMS","WhatsApp"].map(c=>`<option${c===M.ch?" selected":""}>${c}</option>`).join("")}</select></label>
  <label>Template<br><select style="width:100%" onchange="M.txt=TPL[this.value]||M.txt;render()"><option value="">Choose a template</option>${Object.keys(TPL).map(k=>`<option>${k}</option>`).join("")}</select></label>
  <label>Message<br><textarea rows="5" style="width:100%" oninput="M.txt=this.value;preview()">${esc(M.txt)}</textarea></label>
  <div><button class="p" onclick="sendMsg()" ${r.length?"":"disabled"}>Log message to ${r.length} customers</button></div></div></div>
  <div class="card"><h2 style="font-size:1.05rem">Preview</h2><p id="pv" class="pre"></p><p class="sub" id="cc"></p><p class="sub">Messages are logged here. Automatic delivery needs an SMS gateway. Until then, send from your phone using the links below.</p></div></div>
  <div class="card scroll"><h2 style="font-size:1.05rem">Recipients (${r.length})</h2><table><tr><th>Customer</th><th>Phone</th><th>Package</th><th></th></tr>
  ${r.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||"-")}</td><td>${c.package}</td><td>${waLink(c)}</td></tr>`).join("") || `<tr><td colspan="4">No customers match this group.</td></tr>`}</table></div>
  <div class="card scroll"><h2 style="font-size:1.05rem">Logged messages</h2><table><tr><th>When</th><th>Channel</th><th>Group</th><th>Customers</th><th>Message</th></tr>
  ${S.msgs.map(m=>`<tr><td>${fdate(m.sent_at.slice(0,10))}</td><td>${m.channel}</td><td>${esc(m.audience)}</td><td>${m.recipient_count}</td><td>${esc(m.body.slice(0,70))}</td></tr>`).join("") || `<tr><td colspan="5">No messages logged yet.</td></tr>`}</table></div>`;
};
function preview(){
  const r = recips();
  $("#pv").textContent = r.length ? fill(M.txt, r[0]) : "No customers match this group.";
  $("#cc").textContent = M.txt.length + " characters" + (M.ch==="SMS" ? " · " + Math.max(1,Math.ceil(M.txt.length/160)) + " SMS per customer" : "");
}
function waLink(c){
  let d = (c.phone||"").replace(/[\s-]/g,"");
  if (!d) return "";
  if (d[0]==="0") d = "254" + d.slice(1);
  const t = encodeURIComponent(fill(M.txt, c));
  return `<a href="${M.ch==="SMS" ? "sms:+"+d+"?body="+t : "https://wa.me/"+d+"?text="+t}" target="_blank" rel="noopener">Open in ${M.ch}</a>`;
}
setTimeout(()=>{ if(tab==="Messages") preview(); }, 0);

V["AI assistant"] = () => {
  const pending = S.actions.filter(a => a.status === "pending");
  return `<h2>AI assistant</h2><p class="sub">The assistant reads your operations data and can summarize it or propose actions. It never changes data itself. Each proposal waits for your approval.</p>
  <div class="grid k2">
  <div class="card"><h2 style="font-size:1.05rem">Summary</h2>
    <form class="add" onsubmit="summarize(event)"><input id="sc" value="${esc(AI.scope)}" aria-label="Summary scope"><button class="p">Summarize</button></form>
    <p class="pre" id="ai-sum">${esc(AI.summary || (S.summaries[0] ? S.summaries[0].content : "No summary yet."))}</p></div>
  <div class="card"><h2 style="font-size:1.05rem">Propose an action</h2>
    <form class="add" onsubmit="propose(event)"><input id="pi" placeholder="e.g. Remind customers with overdue invoices" aria-label="Instruction" required><button class="p">Propose</button></form>
    <p class="sub">${esc(AI.note)}</p></div></div>
  <div class="card scroll"><h2 style="font-size:1.05rem">Awaiting approval (${pending.length})</h2><table><tr><th>Action</th><th>Details</th><th>Why</th><th></th></tr>
  ${pending.map(a=>`<tr><td><b>${esc(a.action_type)}</b></td><td><code>${esc(JSON.stringify(a.payload))}</code></td><td>${esc(a.rationale)}</td><td><button class="p" onclick="decide(${a.id},true)">Approve</button> <button class="s" onclick="decide(${a.id},false)">Reject</button></td></tr>`).join("") || `<tr><td colspan="4">Nothing waiting for approval.</td></tr>`}</table></div>
  <div class="card scroll"><h2 style="font-size:1.05rem">Recent decisions</h2><table><tr><th>Action</th><th>Status</th><th>Decided</th></tr>
  ${S.actions.filter(a=>a.status!=="pending").slice(0,10).map(a=>`<tr><td>${esc(a.action_type)}</td><td><span class="badge ${a.status==="approved"?"ok":a.status==="rejected"?"warn":"bad"}">${a.status}</span></td><td>${fdate((a.decided_at||"").slice(0,10))}</td></tr>`).join("") || `<tr><td colspan="3">None yet.</td></tr>`}</table></div>`;
};

async function callAI(body){
  const {data:{session}} = await db.auth.getSession();
  if (!session) throw new Error("Sign in again");
  const r = await fetch(SB_URL + "/functions/v1/ai-assistant", {
    method: "POST",
    headers: {"Authorization":"Bearer "+session.access_token, "apikey":SB_KEY, "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || "Request failed");
  return j;
}
async function summarize(e){
  e.preventDefault();
  AI.scope = $("#sc").value.trim() || "Overall operations";
  AI.summary = "Working...";
  render();
  try { const j = await callAI({action:"summarize", scope:AI.scope}); AI.summary = j.content; await load(); render(); }
  catch(err){ AI.summary = ""; toast(err.message); render(); }
}
async function propose(e){
  e.preventDefault();
  try {
    const j = await callAI({action:"propose", instruction:$("#pi").value.trim()});
    AI.note = j.proposed ? "Proposal added to the approval list." : j.reason;
    await load(); render();
  } catch(err){ toast(err.message); }
}
async function decide(id, approve){
  try {
    const j = await callAI({action:"decide", id, approve});
    toast(j.status === "approved" ? "Approved and applied" : j.status === "rejected" ? "Rejected" : "Failed: " + (j.error||""));
    await load(); render();
  } catch(err){ toast(err.message); }
}

async function addLead(e){
  e.preventDefault(); const f=e.target;
  await run(db.from("leads").insert({name:f.ln.value.trim(), source:f.ls.value, package:f.lp.value, stage:0}), "Lead added");
}
async function moveLead(id){
  const l = S.leads.find(x=>x.id===id);
  if (l.stage < 3) return run(db.from("leads").update({stage:l.stage+1}).eq("id",id), "Moved to " + LS[l.stage+1]);
  const {data, error} = await db.from("customers").insert({name:l.name, package:l.package, stage:"Onboarding", service:"PPPoE", last_contact:today()}).select().single();
  if (error) return toast(error.message);
  await run(db.from("leads").update({stage:4, customer_id:data.id}).eq("id",id), l.name + " is now a customer");
}
function genLogin(){ return {pppoe_username: rnd(6,"abcdefghijkmnpqrstuvwxyz") + rnd(3,"23456789"), pppoe_password: rnd(8,"abcdefghjkmnpqrstuvwxyz23456789")}; }
async function addCustomer(e){
  e.preventDefault(); const f=e.target;
  const row = {name:f.cn.value.trim(), phone:f.cph.value.trim(), email:f.cem.value.trim()||null, package:f.cp.value, service:f.cs.value, stage:"Onboarding", last_contact:today(), ...genLogin()};
  await run(db.from("customers").insert(row), row.name + " added");
}
async function setField(table, id, field, value){
  await run(db.from(table).update({[field]: value === "" ? null : value}).eq("id", id), "Saved");
}
async function logContact(id){ await run(db.from("customers").update({last_contact:today()}).eq("id",id), "Contact logged"); }
async function newLogin(id){ await run(db.from("customers").update(genLogin()).eq("id",id), "New login generated"); }
async function delCustomer(id){
  if (dc !== id){ dc = id; render(); toast("Click Delete again to confirm"); return; }
  dc = 0;
  await db.from("leads").update({customer_id:null}).eq("customer_id", id);
  await run(db.from("customers").delete().eq("id", id), "Customer deleted");
}
async function setGoal(id, v){ await run(db.from("goals").update({current_value: parseFloat(v)||0}).eq("id",id), "Saved"); }

async function ensureInvoice(cid, month){
  const existing = invFor(cid, month);
  if (existing) return existing;
  const {data, error} = await db.from("invoices").insert({customer_id:cid, billing_month:month, status:"Due"}).select().single();
  if (error) throw error;
  return data;
}
async function recordPay(e){
  e.preventDefault(); const f=e.target;
  const cid=+f.bc.value, month=f.bm.value, date=f.bd.value, amt=parseFloat(f.ba.value), method=f.bp.value;
  try {
    const inv = await ensureInvoice(cid, month);
    const balance = invPrice(inv) - paid(inv);
    const amount = amt > 0 ? amt : balance;
    if (!(amount > 0)) return toast("That month is already paid in full");
    BM = month;
    await run(db.from("payments").insert({invoice_id:inv.id, amount:Math.round(amount), method, paid_on:date}), money(amount) + " recorded");
  } catch(err){ toast(err.message); }
}
async function markPaid(invId){
  const inv = S.inv.find(i=>i.id===invId);
  const balance = invPrice(inv) - paid(inv);
  if (balance > 0) await run(db.from("payments").insert({invoice_id:invId, amount:balance, method:"Mobile money", paid_on:today()}), "Marked paid in full");
}
async function genInvoices(){
  const rows = S.cust.map(c => ({customer_id:c.id, billing_month:BM, status:"Due"}));
  if (!rows.length) return toast("No customers yet");
  await run(db.from("invoices").upsert(rows, {onConflict:"customer_id,billing_month", ignoreDuplicates:true}), "Invoices generated for " + BM);
}
async function sendMsg(){
  const r = recips();
  if (!r.length || !M.txt.trim()) return toast("Choose a group and write a message first");
  const label = AUD().find(o=>o[0]===M.aud)[1];
  await run(db.from("messages").insert({channel:M.ch, audience:label, recipient_count:r.length, body:M.txt}), "Logged " + r.length + " " + M.ch + " messages");
}

async function signIn(e){
  e.preventDefault();
  $("#lg-err").textContent = ""; $("#lg-btn").disabled = true;
  const {error} = await db.auth.signInWithPassword({email:$("#lg-email").value.trim(), password:$("#lg-pass").value});
  $("#lg-btn").disabled = false;
  if (error) $("#lg-err").textContent = error.message;
}
async function signOut(){ await db.auth.signOut(); }

function showApp(session){
  $("#login").hidden = !!session;
  $("#app").hidden = !session;
  if (session){
    $("#who").textContent = session.user.email;
    load().then(render).catch(err => toast(err.message));
  }
}
db.auth.onAuthStateChange((_event, session) => showApp(session));
