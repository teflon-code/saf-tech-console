async function run(promise, msg){
  const {error} = await promise;
  if (error) { toast(error.message); return false; }
  if (msg) toast(msg);
  await load(); render();
  return true;
}

async function load(){
  const [pk,cu,le,iv,pa,me,go,mk,ac,ch,sp] = await Promise.all([
    db.from("packages").select("*"),
    db.from("customers").select("*").order("id"),
    db.from("leads").select("*").order("id"),
    db.from("invoices").select("*").order("id"),
    db.from("payments").select("*").order("id"),
    db.from("messages").select("*").order("sent_at",{ascending:false}).limit(100),
    db.from("goals").select("*").order("id"),
    db.from("marketing_channels").select("*").order("id"),
    db.from("ai_actions").select("*").order("created_at",{ascending:false}).limit(50),
    db.from("ai_chats").select("*").eq("session_id", AI.sid).order("created_at",{ascending:true}).limit(200),
    db.from("speed_tests").select("*").order("tested_at",{ascending:false}).limit(1000)
  ]);
  const bad = [pk,cu,le,iv,pa,me,go,mk,ac,ch,sp].find(r => r.error);
  if (bad) throw bad.error;
  S = {
    pk: Object.fromEntries(pk.data.map(p => [p.name, p.monthly_price])),
    cust: cu.data, leads: le.data, inv: iv.data, pays: pa.data, msgs: me.data,
    goals: go.data, mk: mk.data, actions: ac.data, chat: ch.data, speeds: sp.data
  };
}

function go(t){
  tab = t;
  document.querySelectorAll("#layout-menu .menu-item").forEach(li => li.classList.toggle("active", li.dataset.tab === t));
  render();
}
function buildMenu(){
  let group = "";
  el("#nav").innerHTML = TABS.map(t => {
    const head = t.group !== group ? (group = t.group, `<li class="menu-header small text-uppercase mt-2"><span class="menu-header-text">${t.group}</span></li>`) : "";
    return `${head}<li class="menu-item ${t.id===tab?"active":""}" data-tab="${t.id}"><a href="javascript:void(0)" class="menu-link" onclick="go('${t.id}')"><i class="menu-icon tf-icons bx ${t.icon}"></i><div>${t.id}</div></a></li>`;
  }).join("");
}
function searchCustomers(v){ QUERY = v.trim().toLowerCase(); if (tab !== "Customers") go("Customers"); else render(); }

function destroyCharts(){ Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function mountChart(id, options){
  const node = document.getElementById(id);
  if (!node) return;
  const base = {
    chart:{toolbar:{show:false}, fontFamily:"Public Sans", background:"transparent", foreColor: isDark() ? "#a3b1c9" : "#697a8d", animations:{speed:500}},
    theme:{mode: isDark() ? "dark" : "light"},
    dataLabels:{enabled:false},
    grid:{borderColor: isDark() ? "#2b3a52" : "#eceef1", strokeDashArray:4},
    colors:["#696cff","#03c3ec","#71dd37","#ffab00","#ff3e1d"],
    legend:{position:"top", horizontalAlign:"right", fontWeight:600}
  };
  const merged = Object.assign({}, base, options, {chart: Object.assign({}, base.chart, options.chart || {})});
  charts[id] = new ApexCharts(node, merged);
  charts[id].render();
}

function render(){

function drawOverview(){
  const months = MO.slice(0,6);
  const billed = months.map(m => S.inv.filter(i=>i.billing_month===m).reduce((a,i)=>a+invPrice(i),0));
  const collected = months.map(m => S.inv.filter(i=>i.billing_month===m).reduce((a,i)=>a+Math.min(invPrice(i),paid(i)),0));
  const bw = el("#ov-billing-wrap");
  if (billed.some(v=>v>0)) { bw.innerHTML = `<div id="chart-billing"></div>`; mountChart("chart-billing", {chart:{type:"bar", height:300}, series:[{name:"Billed", data:billed},{name:"Collected", data:collected}], xaxis:{categories:months.map(m=>m.slice(0,3))}, plotOptions:{bar:{borderRadius:6, columnWidth:"45%"}}, yaxis:{labels:{formatter:v=>Math.round(v/1000)+"k"}}}); }
  else bw.innerHTML = empty("Billing charts appear once invoices exist.");

  const stageCounts = CS.map(s => S.cust.filter(c => c.stage===s && c.status!=="cancelled").length);
  const sw = el("#ov-stage-wrap");
  if (stageCounts.some(v=>v>0)) { sw.innerHTML = `<div id="chart-stage"></div>`; mountChart("chart-stage", {chart:{type:"donut", height:300}, series:stageCounts, labels:CS, legend:{position:"bottom"}, plotOptions:{pie:{donut:{size:"68%"}}}}); }
  else sw.innerHTML = empty("No customers yet.");

  const pk = Object.keys(S.pk);
  const pkCounts = pk.map(p => S.cust.filter(c=>c.status==="active" && c.package===p).length);
  const pw = el("#ov-package-wrap");
  if (pkCounts.some(v=>v>0)) { pw.innerHTML = `<div id="chart-package"></div>`; mountChart("chart-package", {chart:{type:"bar", height:260}, series:[{name:"Active customers", data:pkCounts}], xaxis:{categories:pk}, plotOptions:{bar:{borderRadius:6, columnWidth:"40%"}}}); }
  else pw.innerHTML = empty("No active customers yet.");
}

function recips(){
  const a = M.aud;
  return S.cust.filter(c => {
    if (c.status !== "active") return false;
    if (a==="all") return true;
    const [k,v] = a.split(":");
    if (k==="st") return c.stage===v;
    if (k==="pl") return c.package===v;
    if (k==="sv") return c.service===v;
    return S.inv.some(i => i.customer_id===c.id && status(i)!=="Paid");
  });
}

        <div class="col-4"><div class="small text-body-secondary">Download</div><div class="fw-bolder fs-5">${latest ? latest.download_mbps + " Mbps" : "-"}</div></div>
        <div class="col-4"><div class="small text-body-secondary">Upload</div><div class="fw-bolder fs-5">${latest ? latest.upload_mbps + " Mbps" : "-"}</div></div>
        <div class="col-4"><div class="small text-body-secondary">Latency</div><div class="fw-bolder fs-5">${latest && latest.latency_ms ? latest.latency_ms + " ms" : "-"}</div></div>
      </div>
      <p class="small text-body-secondary">Live readings need a router connection (TR-069 or RADIUS accounting), which is not set up yet. Record speed tests manually below.</p>
      <form class="row g-2 align-items-end" onsubmit="addSpeed(event)">
        <div class="col-4"><label class="form-label small" for="sd">Download</label><input class="form-control form-control-sm" id="sd" type="number" step="any" min="0" required></div>
        <div class="col-4"><label class="form-label small" for="su">Upload</label><input class="form-control form-control-sm" id="su" type="number" step="any" min="0" required></div>
        <div class="col-4"><label class="form-label small" for="sl">Latency (ms)</label><input class="form-control form-control-sm" id="sl" type="number" step="any" min="0"></div>
        <div class="col-12"><button class="btn btn-sm btn-primary">Save speed test</button></div>
      </form>
      <div class="mt-3" id="cust-speed-wrap">${speeds.length ? "" : `<small class="text-body-secondary">Speed history appears after the first test.</small>`}</div>
    </div></div>
    <h6 class="section-title mb-2">Payments</h6>
    <div class="card"><div class="table-responsive"><table class="table table-sm mb-0">
      <thead><tr><th>Date</th><th>Method</th><th class="text-end">Amount</th></tr></thead>
      <tbody>${pays.length ? pays.slice().reverse().map(p=>`<tr><td>${fdate(p.paid_on)}</td><td>${esc(p.method)}</td><td class="text-end">${money(p.amount)}</td></tr>`).join("") : `<tr><td colspan="3">${empty("No payments yet.")}</td></tr>`}</tbody></table></div></div>`;
  drawCustomerCharts(c, pays, speeds);
}
function drawCustomerCharts(c, pays, speeds){
  const now = new Date(), months = [];
  for (let k=11;k>=0;k--){ const d = new Date(now.getFullYear(), now.getMonth()-k, 1); months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  const totals = months.map(m => pays.filter(p => (p.paid_on||"").slice(0,7) === m).reduce((a,p)=>a+p.amount,0));
  const pw = document.getElementById("cust-pay-wrap");
  if (pw) { if (totals.some(v=>v>0)) { pw.innerHTML = `<div id="chart-cust-pay"></div>`; mountChart("chart-cust-pay", {chart:{type:"area", height:220}, series:[{name:"Paid", data:totals}], xaxis:{categories: months.map(m=>m.slice(2))}, stroke:{curve:"smooth", width:3}, fill:{type:"gradient", gradient:{opacityFrom:.35, opacityTo:.02}}}); } else pw.innerHTML = empty("No payments in the last 12 months."); }
  const sw = document.getElementById("cust-speed-wrap");
  if (sw && speeds.length > 1) { sw.innerHTML = `<div id="chart-cust-speed"></div>`; mountChart("chart-cust-speed", {chart:{type:"line", height:200}, series:[{name:"Download", data: speeds.map(s=>s.download_mbps)},{name:"Upload", data: speeds.map(s=>s.upload_mbps)}], xaxis:{categories: speeds.map(s=>fdate(s.tested_at))}, stroke:{curve:"smooth", width:3}}); }
}
async function setPause(id, pause){
  const update = pause ? {status:"paused", paused_at:new Date().toISOString(), pause_reason:"Paused by owner"} : {status:"active", paused_at:null, pause_reason:null};
  const ok = await run(db.from("customers").update(update).eq("id", id), pause ? "Subscription paused" : "Subscription resumed");
  if (ok) renderCustomer();
}
async function addSpeed(e){
  e.preventDefault(); const f = e.target;
  const row = {customer_id: PANEL_ID, download_mbps: +f.sd.value, upload_mbps: +f.su.value, latency_ms: f.sl.value ? +f.sl.value : null};
  const {error} = await db.from("speed_tests").insert(row);
  if (error) return toast(error.message);
  toast("Speed test saved");
  openCustomer(PANEL_ID);
}

// ---- Assistant ----
function openAssistant(){ Offcanvas.getOrCreateInstance(el("#assistant-panel")).show(); renderAI(); setTimeout(() => el("#chatin").focus(), 200); }
function askAssistant(prefill){
  openAssistant();
  const box = el("#chatin"); box.value = prefill; box.focus();
}
function renderAI(){
  const body = el("#ai-body");
  if (!body) return;
  const pending = S.actions.filter(a => a.status === "pending");
  const badge = el("#ai-badge");
  badge.hidden = !pending.length; badge.textContent = pending.length;
  const turns = S.chat.filter(m => m.role === "user" || m.role === "assistant");
  const approvals = pending.map(a => `<div class="card border-warning"><div class="card-body p-3"><div class="fw-bold small text-uppercase">${esc(a.action_type.replace(/_/g," "))}</div><div class="small mt-1" style="white-space:pre-wrap">${esc(a.rationale)}</div><div class="mt-2 d-flex gap-2"><button class="btn btn-sm btn-primary" onclick="decide(${a.id},true)">Approve</button><button class="btn btn-sm btn-outline-secondary" onclick="decide(${a.id},false)">Reject</button></div></div></div>`).join("");
  const bubbles = turns.map(m => `<div class="p-2 px-3 rounded ${m.role==="user"?"bg-primary text-white align-self-end":"bg-lighter align-self-start"}" style="max-width:88%;white-space:pre-wrap">${esc(m.content)}</div>`).join("");
  body.innerHTML = (turns.length ? bubbles : `<div class="small text-body-secondary p-2">Ask for a payments summary, analytics, complaint replies, pauses, cancellations or messages. Changes wait here for your approval.</div>`)
    + approvals + (busy ? `<div class="small text-body-secondary">Working...</div>` : "");
  body.scrollTop = body.scrollHeight;
  el("#ai-send").disabled = busy;
  el("#chatin").disabled = busy;
}
async function sendChat(e){
  e.preventDefault();
  const ta = el("#chatin"), message = ta.value.trim();
  if (!message || busy) return;
  busy = true; ta.value = "";
  S.chat.push({role:"user", content:message, created_at:new Date().toISOString()});
  renderAI();
  try { await callAI({action:"chat", message, session_id:AI.sid}); await load(); }
  catch(err){ toast(err.message); }
  finally { busy = false; render(); setTimeout(() => el("#chatin").focus(), 0); }
}
async function callAI(body){
  const {data:{session}} = await db.auth.getSession();
  if (!session) throw new Error("Sign in again");
  const r = await fetch(SB_URL + "/functions/v1/ai-assistant", {
    method: "POST",
    headers: {"Authorization":"Bearer "+session.access_token, "apikey":SB_KEY, "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ("AI request failed (" + r.status + ")"));
  return j;
}
async function decide(id, approve){
  try {
    const j = await callAI({action:"decide", id, approve});
    toast(j.status === "approved" ? "Approved and applied" : j.status === "rejected" ? "Rejected" : "Failed: " + (j.error || (j.result && j.result.error) || ""));
    await load(); render();
  } catch(err){ toast(err.message); }
}

// ---- Data actions ----
async function addLead(e){ e.preventDefault(); const f=e.target; await run(db.from("leads").insert({name:f.ln.value.trim(), source:f.ls.value, package:f.lp.value, stage:0}), "Lead added"); }
async function moveLead(id){
  const l = S.leads.find(x=>x.id===id);
  if (l.stage < 3) return run(db.from("leads").update({stage:l.stage+1}).eq("id",id), "Moved to " + LS[l.stage+1]);
  const {data, error} = await db.from("customers").insert({name:l.name, package:l.package, stage:"Onboarding", service:"PPPoE", last_contact:today(), account_no:await nextAccountNo(), ...genLogin()}).select().single();
  if (error) return toast(error.message);
  await run(db.from("leads").update({stage:4, customer_id:data.id}).eq("id",id), l.name + " is now a customer");
}
function genLogin(){ return {pppoe_username: rnd(6,"abcdefghijkmnpqrstuvwxyz") + rnd(3,"23456789"), pppoe_password: rnd(8,"abcdefghjkmnpqrstuvwxyz23456789")}; }
async function nextAccountNo(){
  const { data } = await db.from("customers").select("account_no").order("id", {ascending:false}).limit(50);
  const nums = (data ?? []).map(c => parseInt(String(c.account_no||"").replace(/\D/g,""),10)).filter(n => !isNaN(n));
  return "SAF-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4,"0");
}
async function addCustomer(e){
  e.preventDefault(); const f=e.target;
  const row = {account_no:await nextAccountNo(), name:f.cn.value.trim(), phone:f.cph.value.trim(), package:f.cp.value, service:f.cs.value, stage:"Onboarding", status:"active", last_contact:today(), ...genLogin()};
  await run(db.from("customers").insert(row), row.name + " added as " + row.account_no);
}
async function setField(table, id, field, value){ await run(db.from(table).update({[field]: value === "" ? null : value}).eq("id", id), "Saved"); }
async function logContact(id){ await run(db.from("customers").update({last_contact:today()}).eq("id",id), "Contact logged"); }
async function newLogin(id){ await run(db.from("customers").update(genLogin()).eq("id",id), "New login generated"); }
async function delCustomer(id){
  if (dc !== id){ dc = id; render(); toast("Click Confirm to delete"); return; }
  dc = 0;
  await db.from("leads").update({customer_id:null}).eq("customer_id", id);
  await run(db.from("customers").delete().eq("id", id), "Customer deleted");
}
async function setGoal(id, v){ await run(db.from("goals").update({current_value: parseFloat(v)||0}).eq("id",id), "Saved"); }
async function ensureInvoice(cid, month){
  const existing = invFor(cid, month);
  if (existing) return existing;
  const {data, error} = await db.from("invoices").insert({customer_id:cid, billing_month:month, status:"Due"}).select().single();
  if (error) throw error;
  return data;
}
async function recordPay(e){
  e.preventDefault(); const f=e.target;
  const cid=+f.bc.value, month=f.bm.value, date=f.bd.value, amt=parseFloat(f.ba.value), method=f.bp.value;
  try {
    const inv = await ensureInvoice(cid, month);
    const balance = invPrice(inv) - paid(inv);
    const amount = amt > 0 ? amt : balance;
    if (!(amount > 0)) return toast("That month is already paid in full");
    BM = month;
    await run(db.from("payments").insert({invoice_id:inv.id, amount:Math.round(amount), method, paid_on:date}), money(amount) + " recorded");
  } catch(err){ toast(err.message); }
}
async function markPaid(invId){
  const inv = S.inv.find(i=>i.id===invId);
  const balance = invPrice(inv) - paid(inv);
  if (balance > 0) await run(db.from("payments").insert({invoice_id:invId, amount:balance, method:"Mobile money", paid_on:today()}), "Marked paid in full");
}
async function genInvoices(){
  const rows = S.cust.filter(c=>c.status!=="cancelled").map(c => ({customer_id:c.id, billing_month:BM, status:"Due"}));
  if (!rows.length) return toast("No active customers yet");
  await run(db.from("invoices").upsert(rows, {onConflict:"customer_id,billing_month", ignoreDuplicates:true}), "Invoices generated for " + BM);
}
async function sendMsg(){
  const r = recips();
  if (!r.length || !M.txt.trim()) return toast("Choose a group and write a message first");
  const label = AUD().find(o=>o[0]===M.aud)[1];
  await run(db.from("messages").insert({channel:M.ch, audience:label, recipient_count:r.length, body:M.txt}), "Logged " + r.length + " " + M.ch + " messages");
}

// ---- Theme ----
function applyTheme(dark){
  document.documentElement.classList.remove("light-style","dark-style");
  document.documentElement.classList.add(dark ? "dark-style" : "light-style");
  const b = el("#theme-toggle");
  if (b) { b.setAttribute("aria-pressed", String(dark)); el("#theme-label").textContent = dark ? "Light mode" : "Dark mode"; b.querySelector("i").className = dark ? "bx bx-sun me-1" : "bx bx-moon me-1"; }
}
function toggleTheme(){
  const dark = !isDark();
  try { localStorage.setItem("saf_theme", dark ? "dark" : "light"); } catch(e) {}
  applyTheme(dark);
  render();
}

// ---- Screens ----
function showLogin(message){
  el("#app-shell").hidden = true;
  el("#login-page").hidden = false;
  el("#lg-err").textContent = message || "";
  destroyCharts();
}
function showDashboard(){
  el("#login-page").hidden = true;
  el("#app-shell").hidden = false;
}
async function signIn(e){
  e.preventDefault();
  el("#lg-err").textContent = ""; el("#lg-btn").disabled = true;
  const {error} = await db.auth.signInWithPassword({email:el("#lg-email").value.trim(), password:el("#lg-pass").value});
  el("#lg-btn").disabled = false;
  if (error) el("#lg-err").textContent = error.message;
}
async function signOut(){ await db.auth.signOut(); }

db.auth.onAuthStateChange((_event, session) => setTimeout(async () => {
  if (!session) { showLogin(); return; }
  if (session.user.id !== OWNER_ID) {
    setTimeout(() => db.auth.signOut(), 0);
    showLogin("This account is not allowed to use the console.");
    return;
  }
  showDashboard();
  el("#owner-box").innerHTML = `<div class="fw-semibold text-body">Owner</div><div class="text-break">${esc(session.user.email)}</div>`;
  applyTheme(isDark());
  try { await load(); render(); } catch(err){ toast(err.message); }
}, 0));
</script>
