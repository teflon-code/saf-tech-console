<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF-TECH Operations Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] },
      colors: {
        ink: 'var(--ink)', muted: 'var(--muted)', panel: 'var(--panel)', page: 'var(--page)',
        line: 'var(--line)', accent: 'var(--accent)', accentink: 'var(--accent-ink)', soft: 'var(--soft)'
      },
      boxShadow: { card: '0 1px 2px rgba(16,24,40,.04)', pop: '0 24px 60px rgba(16,24,40,.22)' }
    } }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* Two themes. Switch with the theme button in the header. */
:root, [data-theme="bank"]{
  --page:#f5f6fa; --panel:#ffffff; --soft:#f4f6fb; --ink:#2d3a5a; --muted:#8a94ab; --line:#e8ebf3;
  --accent:#1a0dfa; --accent-ink:#ffffff; --accent-soft:#eceeff; --chart-a:#1a0dfa; --chart-b:#18d4c9;
  --grad:linear-gradient(135deg,#1a0dfa 0%,#4b43ff 100%);
  --focus:#1a0dfa;
}
[data-theme="stack"]{
  --page:#f5f6fa; --panel:#ffffff; --soft:#f4f6fb; --ink:#1f2937; --muted:#7b8497; --line:#e5e7eb;
  --accent:#4880ff; --accent-ink:#ffffff; --accent-soft:#e8efff; --chart-a:#4880ff; --chart-b:#f87171;
  --grad:linear-gradient(135deg,#4880ff,#6b9bff);
  --focus:#4880ff;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-btn[aria-current="page"]{color:var(--accent);font-weight:600}
[data-theme="bank"] .nav-btn[aria-current="page"]{background:transparent}
[data-theme="stack"] .nav-btn[aria-current="page"]{background:var(--accent);color:#fff;border-radius:12px}
[data-theme="bank"] .nav-btn[aria-current="page"] .navbar{display:block}
.navbar{display:none;position:absolute;left:-16px;top:0;bottom:0;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
[data-theme="stack"] .navbar{display:none!important}
.card-bank-a{background:var(--grad);color:#fff}
.card-bank-b{background:#fff;color:var(--ink);border:1px solid var(--line)}
.bar-track{height:8px;border-radius:999px;background:#eef1f7;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--accent)}
.table-head th{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill-ok{background:#dcfce7;color:#15803d}.pill-warn{background:#fef3c7;color:#b45309}.pill-bad{background:#fee2e2;color:#b91c1c}.pill-info{background:var(--accent-soft);color:var(--accent)}.pill-neutral{background:#eef1f7;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--soft)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.08);background:var(--accent)}
.btn-danger{color:#b91c1c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel);color:var(--ink);font:inherit;font-size:.9rem}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:2px solid var(--focus);outline-offset:0}
.avatar{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:600;font-size:.8rem;background:var(--accent-soft);color:var(--accent);flex:none}
.toast{transition:opacity .2s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="font-sans">

<section id="login" class="min-h-screen grid place-items-center p-6" hidden>
  <div class="w-full max-w-sm rounded-2xl bg-panel p-8 shadow-pop">
    <div class="flex items-center gap-2 text-lg font-bold"><span class="grid h-9 w-9 place-items-center rounded-xl bg-accent text-accentink">S</span>SAF-TECH.</div>
    <h1 class="mt-6 text-xl font-semibold">Sign in</h1>
    <p class="mt-1 text-sm text-muted">Owner account only.</p>
    <form class="mt-6 grid gap-4" onsubmit="signIn(event)">
      <div class="field"><label for="lg-email">Email</label><input class="input" id="lg-email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="lg-pass">Password</label><input class="input" id="lg-pass" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-accent" id="lg-btn" type="submit">Sign in</button>
    </form>
    <p id="lg-err" class="mt-4 text-sm text-red-600" role="alert"></p>
  </div>
</section>

<div id="app" class="flex min-h-screen" hidden>
  <!-- Sidebar -->
  <aside id="side" class="fixed inset-y-0 left-0 z-40 flex w-60 -translate-x-full flex-col gap-6 overflow-y-auto border-r border-line bg-panel p-5 transition-transform lg:static lg:translate-x-0" aria-label="Main navigation">
    <div class="flex items-center gap-2 px-2 text-lg font-bold" id="brand"><span class="grid h-9 w-9 place-items-center rounded-xl bg-accent text-accentink">S</span><span>SAF-TECH.</span></div>
    <nav id="nav" class="flex flex-col gap-1" aria-label="Sections"></nav>
    <div class="mt-auto rounded-2xl bg-soft p-4 text-sm" id="who"></div>
  </aside>
  <div id="scrim" class="fixed inset-0 z-30 hidden bg-black/30 lg:hidden" onclick="toggleMenu(false)"></div>

  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-20 flex flex-wrap items-center gap-3 border-b border-line bg-panel px-4 py-3 md:px-8">
      <button class="grid h-10 w-10 place-items-center rounded-xl border border-line lg:hidden" aria-label="Open menu" aria-controls="side" aria-expanded="false" id="menu-btn" onclick="toggleMenu(true)">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h2 id="title" class="text-xl font-bold md:text-2xl">Overview</h2>
      <div class="ml-auto flex w-full items-center gap-2 md:w-auto">
        <label class="relative flex min-w-0 flex-1 md:w-72 md:flex-none">
          <span class="sr-only">Search customers</span>
          <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" class="input pl-9" placeholder="Search customers" oninput="searchCustomers(this.value)">
        </label>
        <button class="btn px-3" id="theme-btn" onclick="toggleTheme()" aria-label="Switch theme"><span id="theme-label">DashStack</span></button>
        <button class="btn px-3" onclick="signOut()" aria-label="Sign out">Sign out</button>
      </div>
    </header>

    <main id="view" class="flex min-w-0 flex-1 flex-col gap-5 p-4 md:p-8" tabindex="-1"></main>
  </div>
</div>

<!-- AI assistant pop-up, available on every section -->
<button id="ai-fab" class="fixed bottom-6 right-6 z-50 hidden h-14 items-center gap-2 rounded-full bg-accent px-5 font-semibold text-accentink shadow-pop" aria-expanded="false" aria-controls="ai-panel" onclick="toggleAI()">
  <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <span id="ai-fab-label">Ask the assistant</span>
</button>
<section id="ai-panel" class="fixed bottom-24 right-4 z-50 hidden h-[min(640px,calc(100vh-130px))] w-[min(420px,calc(100vw-32px))] flex-col overflow-hidden rounded-2xl border border-line bg-panel shadow-pop" role="dialog" aria-labelledby="ai-title">
  <div class="flex items-center justify-between border-b border-line p-4">
    <div><h2 id="ai-title" class="font-semibold">AI assistant</h2><p class="text-xs text-muted">Reads your data. Changes wait for your approval.</p></div>
    <button class="grid h-9 w-9 place-items-center rounded-lg border border-line" aria-label="Close assistant" onclick="toggleAI(false)">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="ai-body" class="flex flex-1 flex-col gap-2 overflow-y-auto bg-soft p-3" role="log" aria-live="polite"></div>
  <form class="flex items-end gap-2 border-t border-line p-3" onsubmit="sendChat(event)">
    <label class="sr-only" for="chatin">Message to the assistant</label>
    <textarea id="chatin" class="input max-h-32 flex-1" rows="1" placeholder="Ask about payments, customers or complaints" required></textarea>
    <button class="btn btn-accent" id="ai-send">Send</button>
  </form>
</section>

<div id="toast" class="toast pointer-events-none fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-ink px-5 py-3 text-sm font-medium text-white opacity-0" role="status" aria-live="polite"></div>

<script>
const SB_URL = "https://rjzeqptfwxzhuofsbamc.supabase.co";
const SB_KEY = "sb_publishable_KlijfrZpv4RGZZOTzgL3ag_q4Gpf0wU";
const OWNER_ID = "d3e8ee83-ab03-4b4a-a97e-8fc2112864c2";
const db = supabase.createClient(SB_URL, SB_KEY);

const ICON = {
  overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  customers:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 4.5"/>',
  login:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  details:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  leads:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  marketing:'<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
  goals:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
  billing:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
  messages:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'
};
const TABS = [
  {id:"Overview", icon:"overview", group:"Dashboards"},
  {id:"Customers", icon:"customers", group:"Customers"},
  {id:"Login details", icon:"login", group:"Customers"},
  {id:"Tertiary info", icon:"details", group:"Customers"},
  {id:"Leads", icon:"leads", group:"Growth"},
  {id:"Marketing", icon:"marketing", group:"Growth"},
  {id:"Goals", icon:"goals", group:"Growth"},
  {id:"Billing", icon:"billing", group:"Finance"},
  {id:"Messages", icon:"messages", group:"Finance"}
];
const CS = ["Onboarding","Active","Upsell","At risk"];
const LS = ["New","Contacted","Site survey","Quoted","Won"];
const NEXT = {"Onboarding":"Confirm install and Wi-Fi setup","Active":"Check-in call at 90 days","Upsell":"Offer a faster plan","At risk":"Call within 48 hours"};
const MO = ["Jun 2026","Jul 2026","Aug 2026","Sep 2026","Oct 2026","Nov 2026"];
const TPL = {
  "Billing reminder":"Hello {name}, your {package} bill of {amount} is due. Please pay before the due date to avoid disconnection. Thank you, SAF-TECH.",
  "Service outage":"Hello {name}, we are fixing a network fault in your area and service will be restored shortly. We apologize for the inconvenience. SAF-TECH.",
  "Upgrade offer":"Hello {name}, upgrade from {package} to a faster package this month and get your first week free. Reply YES to upgrade. SAF-TECH.",
  "Welcome":"Welcome to SAF-TECH, {name}! Your {package} package is being set up and our technician will contact you shortly."
};
const TF = [["Location","location","text","Area or street"],["ID number","national_id","text","National ID"],["Alternate contact","alternate_contact","text","Name and phone"],["Installed on","installed_on","date",""],["Equipment serial","equipment_serial","text","Router or ONT serial"],["Notes","notes","text","Anything else"]];

let S = {pk:{},cust:[],leads:[],inv:[],pays:[],msgs:[],goals:[],mk:[],actions:[],chat:[]};
let tab = "Overview", BM = "Oct 2026", SH = false, dc = 0, QUERY = "", busy = false, charts = [];
let M = {aud:"all", ch:"SMS", txt:TPL["Service outage"]};
const AI = {sid: localStorage.getItem("saf_sid") || (localStorage.setItem("saf_sid", crypto.randomUUID()), localStorage.getItem("saf_sid"))};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "KSh " + Math.round(n || 0).toLocaleString("en-US");
const today = () => new Date().toISOString().slice(0,10);
const rnd = (len, chars) => { let s=""; for(let i=0;i<len;i++) s+=chars.charAt(Math.floor(Math.random()*chars.length)); return s; };
const price = c => S.pk[c.package] || 0;
const cust = id => S.cust.find(c => c.id === id) || {name:"Unknown", package:"Bronze", account_no:"-"};
const paid = inv => S.pays.filter(p => p.invoice_id === inv.id).reduce((a,p) => a + p.amount, 0);
const invPrice = inv => price(cust(inv.customer_id));
const status = inv => { const p = paid(inv), pr = invPrice(inv); return p >= pr ? "Paid" : p > 0 ? "Partial" : inv.status; };
const pill = s => {
  const map = {Paid:"pill-ok", Active:"pill-ok", Partial:"pill-warn", Due:"pill-warn", Overdue:"pill-bad", Cancelled:"pill-bad", "At risk":"pill-bad", Upsell:"pill-info", open:"pill-warn", responded:"pill-info", resolved:"pill-ok", approved:"pill-ok", failed:"pill-bad", pending:"pill-warn", PPPoE:"pill-info", Hotspot:"pill-info", Onboarding:"pill-neutral"};
  return `<span class="pill ${map[s] ?? "pill-neutral"}">${esc(s)}</span>`;
};
const fdate = d => d ? new Date(d.length === 10 ? d + "T00:00:00" : d).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}) : "-";
const ago = d => { if(!d) return ""; const m=Math.round((Date.now()-new Date(d))/60000); if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<24) return h+" hours ago"; return fdate(d); };
const invFor = (cid, m) => S.inv.find(i => i.customer_id === cid && i.billing_month === m);
const initials = n => esc(String(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase());
const ic = k => `<svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

function toast(t){ const e=$("#toast"); e.textContent=t; e.style.opacity=1; clearTimeout(window._tt); window._tt=setTimeout(()=>e.style.opacity=0,2800); }

async function run(promise, msg){
  const {error} = await promise;
  if (error) { toast(error.message); return false; }
  if (msg) toast(msg);
  await load(); render();
  return true;
}

async function load(){
  const [pk,cu,le,iv,pa,me,go,mk,ac,ch] = await Promise.all([
    db.from("packages").select("*"),
    db.from("customers").select("*").order("id"),
    db.from("leads").select("*").order("id"),
    db.from("invoices").select("*").order("id"),
    db.from("payments").select("*").order("id"),
    db.from("messages").select("*").order("sent_at",{ascending:false}).limit(100),
    db.from("goals").select("*").order("id"),
    db.from("marketing_channels").select("*").order("id"),
    db.from("ai_actions").select("*").order("created_at",{ascending:false}).limit(50),
    db.from("ai_chats").select("*").eq("session_id", AI.sid).order("created_at",{ascending:true}).limit(200)
  ]);
  const bad = [pk,cu,le,iv,pa,me,go,mk,ac,ch].find(r => r.error);
  if (bad) throw bad.error;
  S = {
    pk: Object.fromEntries(pk.data.map(p => [p.name, p.monthly_price])),
    cust: cu.data, leads: le.data, inv: iv.data, pays: pa.data,
    msgs: me.data, goals: go.data, mk: mk.data, actions: ac.data, chat: ch.data
  };
}

function go(t){ tab = t; toggleMenu(false); render(); $("#view").focus({preventScroll:true}); }
function toggleMenu(open){
  const s=$("#side");
  s.classList.toggle("-translate-x-full", !open);
  $("#scrim").classList.toggle("hidden", !open);
  $("#menu-btn").setAttribute("aria-expanded", String(!!open));
}
function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme") === "bank" ? "stack" : "bank";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("saf_theme", next);
  $("#theme-label").textContent = next === "bank" ? "DashStack" : "BankDash";
  render();
}
function searchCustomers(v){ QUERY = v.trim().toLowerCase(); if (tab !== "Customers") go("Customers"); else render(); }

function render(){
  let group = "";
  $("#nav").innerHTML = TABS.map(t => {
    const head = t.group !== group ? (group = t.group, `<div class="mt-4 px-3 text-xs font-medium text-muted first:mt-0">${t.group}</div>`) : "";
    return `${head}<button type="button" class="nav-btn relative flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm text-muted hover:text-ink" ${t.id===tab?'aria-current="page"':""} onclick="go('${t.id}')"><span class="navbar"></span>${ic(t.icon)}<span>${t.id}</span></button>`;
  }).join("");
  $("#title").textContent = tab === "Overview" ? "Overview" : tab;
  destroyCharts();
  $("#view").innerHTML = V[tab]();
  initCharts();
  renderAI();
  if (tab === "Messages") preview();
}

const CA = () => getComputedStyle(document.documentElement).getPropertyValue("--chart-a").trim();
const CB = () => getComputedStyle(document.documentElement).getPropertyValue("--chart-b").trim();
function destroyCharts(){ charts.forEach(c => c.destroy()); charts = []; }
function chartOpts(extra={}){
  return Object.assign({responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false},ticks:{color:"#8a94ab"}}, y:{grid:{color:"#eef1f7"},ticks:{color:"#8a94ab"}}}}, extra);
}
function initCharts(){
  if (tab !== "Overview") return;
  const months = MO.slice(0,6);
  const billed = months.map(m => S.inv.filter(i=>i.billing_month===m).reduce((a,i)=>a+invPrice(i),0));
  const collected = months.map(m => S.inv.filter(i=>i.billing_month===m).reduce((a,i)=>a+Math.min(invPrice(i),paid(i)),0));
  const c1 = document.getElementById("chart-billing");
  if (c1) charts.push(new Chart(c1, {type:"bar", data:{labels:months.map(m=>m.slice(0,3)), datasets:[
    {label:"Billed", data:billed, backgroundColor:CA(), borderRadius:8, barThickness:14},
    {label:"Collected", data:collected, backgroundColor:CB(), borderRadius:8, barThickness:14}
  ]}, options: chartOpts({plugins:{legend:{display:true, position:"top", align:"end", labels:{usePointStyle:true, boxWidth:8, color:"#8a94ab"}}}})}));

  const stages = CS.map(s => S.cust.filter(c => c.stage===s && c.status!=="cancelled").length);
  const c2 = document.getElementById("chart-stage");
  if (c2) charts.push(new Chart(c2, {type:"doughnut", data:{labels:CS, datasets:[{data:stages, backgroundColor:["#1a0dfa","#18d4c9","#f472b6","#fbbf24"], borderWidth:0}]}, options:{responsive:true, maintainAspectRatio:false, cutout:"62%", plugins:{legend:{position:"bottom", labels:{usePointStyle:true, boxWidth:8, color:"#8a94ab"}}}}}));

  let running = 0; const cum = S.pays.slice().sort((a,b)=>a.paid_on.localeCompare(b.paid_on)).map(p => (running += p.amount));
  const c3 = document.getElementById("chart-history");
  if (c3) charts.push(new Chart(c3, {type:"line", data:{labels: cum.length ? S.pays.slice().sort((a,b)=>a.paid_on.localeCompare(b.paid_on)).map(p=>p.paid_on.slice(5)) : ["-"], datasets:[{label:"Cumulative collected", data: cum.length ? cum : [0], borderColor:CA(), backgroundColor:"rgba(26,13,250,.08)", fill:true, tension:.35, pointRadius:0, borderWidth:2.5}]}, options: chartOpts()}));

  const pk = Object.keys(S.pk).map(p => S.cust.filter(c=>c.status!=="cancelled" && c.package===p).length);
  const c4 = document.getElementById("chart-package");
  if (c4) charts.push(new Chart(c4, {type:"bar", data:{labels:Object.keys(S.pk), datasets:[{data:pk, backgroundColor:CA(), borderRadius:8, barThickness:26}]}, options: chartOpts()}));
}

const V = {};

function kpi(label, value, sub, tone){
  const tones = {bank:"card-bank-a", light:"bg-panel border border-line"};

};

V["Goals"] = () => `
<div><h1 class="text-2xl font-bold">Goals</h1><p class="text-sm text-muted">Update the current value as results come in.</p></div>
<div class="grid gap-5 md:grid-cols-2">${S.goals.map(g=>{
  let p = g.lower_is_better ? (g.target_value / g.current_value) * 100 : g.minimum_value != null ? (g.current_value - g.minimum_value)/(g.target_value - g.minimum_value)*100 : g.current_value/g.target_value*100;
  p = Math.max(0, Math.min(100, p));
  return `<div class="rounded-2xl bg-panel p-5 shadow-card"><div class="flex flex-wrap items-center justify-between gap-2"><b>${esc(g.title)}</b><span class="text-sm text-muted">Target ${g.unit==="KSh"?"KSh ":""}${Number(g.target_value).toLocaleString("en-US")}${g.unit==="%"?"%":""}</span></div><div class="bar-track my-4" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><div class="bar-fill" style="width:${p}%"></div></div><div class="flex items-end gap-3"><div class="field max-w-44"><label for="g${g.id}">Current value</label><input id="g${g.id}" class="input" type="number" step="any" value="${g.current_value}" onchange="setGoal(${g.id},this.value)"></div><span class="pb-2 text-sm text-muted">${Math.round(p)}% there</span></div></div>`}).join("")}</div>`;

// AI assistant pop-up, shared by every section
function toggleAI(force){
  const panel = $("#ai-panel"), fab = $("#ai-fab");
  const open = typeof force === "boolean" ? force : panel.classList.contains("hidden");
  panel.classList.toggle("hidden", !open);
  panel.classList.toggle("flex", open);
  fab.setAttribute("aria-expanded", String(open));
  if (open) { renderAI(); setTimeout(() => $("#chatin").focus(), 0); }
}
function renderAI(){
  const body = $("#ai-body");
  if (!body) return;
  const pending = S.actions.filter(a => a.status === "pending");
  const turns = S.chat.filter(m => m.role === "user" || m.role === "assistant");
  const approvals = pending.map(a => `<div class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm"><b>${esc(a.action_type.replace(/_/g," "))}</b><div class="mt-1 whitespace-pre-wrap break-words">${esc(a.rationale)}</div><div class="mt-2 flex gap-2"><button class="btn btn-accent min-h-9 px-3 text-sm" onclick="decide(${a.id},true)">Approve</button><button class="btn min-h-9 px-3 text-sm" onclick="decide(${a.id},false)">Reject</button></div></div>`).join("");
  const bubbles = turns.map(m => `<div class="max-w-[88%] whitespace-pre-wrap break-words rounded-2xl px-3 py-2 text-sm ${m.role==="user"?"ml-auto bg-accent text-accentink":"bg-panel border border-line"}">${esc(m.content)}</div>`).join("");
  body.innerHTML = (turns.length ? bubbles : `<div class="max-w-[88%] rounded-2xl border border-line bg-panel px-3 py-2 text-sm">Ask for a payments summary, analytics, complaint replies, cancellations or messages. Changes wait here for your approval.</div>`)
    + approvals + (busy ? `<div class="max-w-[88%] rounded-2xl border border-line bg-panel px-3 py-2 text-sm">Working...</div>` : "");
  body.scrollTop = body.scrollHeight;
  const send = $("#ai-send"), input = $("#chatin");
  if (send) send.disabled = busy;
  if (input) input.disabled = busy;
  const label = $("#ai-fab-label");
  if (label) label.textContent = "Ask the assistant" + (pending.length ? ` (${pending.length})` : "");
  $("#ai-fab").classList.remove("hidden");
  $("#ai-fab").classList.add("flex");
}
async function sendChat(e){
  e.preventDefault();
  const ta = $("#chatin");
  const message = ta.value.trim();
  if (!message || busy) return;
  busy = true; ta.value = "";
  S.chat.push({role:"user", content:message, created_at:new Date().toISOString()});
  renderAI();
  try {
    await callAI({action:"chat", message, session_id:AI.sid});
    await load();
  } catch(err){
    toast(err.message);
  } finally {
    busy = false;
    render();
    if (!$("#ai-panel").classList.contains("hidden")) setTimeout(() => $("#chatin").focus(), 0);
  }
}
async function callAI(body){
  const {data:{session}} = await db.auth.getSession();
  if (!session) throw new Error("Sign in again");
  const r = await fetch(SB_URL + "/functions/v1/ai-assistant", {
    method: "POST",
    headers: {"Authorization":"Bearer "+session.access_token, "apikey":SB_KEY, "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ("AI request failed (" + r.status + ")"));
  return j;
}
async function decide(id, approve){
  try {
    const j = await callAI({action:"decide", id, approve});
    toast(j.status === "approved" ? "Approved and applied" : j.status === "rejected" ? "Rejected" : "Failed: " + (j.error || (j.result && j.result.error) || ""));
    await load(); render();
  } catch(err){ toast(err.message); }
}

async function addLead(e){
  e.preventDefault(); const f=e.target;
  await run(db.from("leads").insert({name:f.ln.value.trim(), source:f.ls.value, package:f.lp.value, stage:0}), "Lead added");
}
async function moveLead(id){
  const l = S.leads.find(x=>x.id===id);
  if (l.stage < 3) return run(db.from("leads").update({stage:l.stage+1}).eq("id",id), "Moved to " + LS[l.stage+1]);
  const {data, error} = await db.from("customers").insert({name:l.name, package:l.package, stage:"Onboarding", service:"PPPoE", last_contact:today(), account_no:await nextAccountNo(), ...genLogin()}).select().single();
  if (error) return toast(error.message);
  await run(db.from("leads").update({stage:4, customer_id:data.id}).eq("id",id), l.name + " is now a customer");
}
function genLogin(){ return {pppoe_username: rnd(6,"abcdefghijkmnpqrstuvwxyz") + rnd(3,"23456789"), pppoe_password: rnd(8,"abcdefghjkmnpqrstuvwxyz23456789")}; }
async function nextAccountNo(){
  const { data } = await db.from("customers").select("account_no").order("id", {ascending:false}).limit(50);
  const nums = (data ?? []).map(c => parseInt(String(c.account_no||"").replace(/\D/g,""),10)).filter(n => !isNaN(n));
  const n = (nums.length ? Math.max(...nums) : 0) + 1;
  return "SAF-" + String(n).padStart(4,"0");
}
async function addCustomer(e){
  e.preventDefault(); const f=e.target;
  const row = {account_no:await nextAccountNo(), name:f.cn.value.trim(), phone:f.cph.value.trim(), email:f.cem.value.trim()||null, package:f.cp.value, service:f.cs.value, stage:"Onboarding", last_contact:today(), ...genLogin()};
  await run(db.from("customers").insert(row), row.name + " added as " + row.account_no);
}
async function setField(table, id, field, value){
  await run(db.from(table).update({[field]: value === "" ? null : value}).eq("id", id), "Saved");
}
async function logContact(id){ await run(db.from("customers").update({last_contact:today()}).eq("id",id), "Contact logged"); }
async function newLogin(id){ await run(db.from("customers").update(genLogin()).eq("id",id), "New login generated"); }
async function delCustomer(id){
  if (dc !== id){ dc = id; render(); toast("Select Delete again to confirm"); return; }
  dc = 0;
  await db.from("leads").update({customer_id:null}).eq("customer_id", id);
  await run(db.from("customers").delete().eq("id", id), "Customer deleted");
}
async function setGoal(id, v){ await run(db.from("goals").update({current_value: parseFloat(v)||0}).eq("id",id), "Saved"); }

async function ensureInvoice(cid, month){
  const existing = invFor(cid, month);
  if (existing) return existing;
  const {data, error} = await db.from("invoices").insert({customer_id:cid, billing_month:month, status:"Due"}).select().single();
  if (error) throw error;
  return data;
}
async function recordPay(e){
  e.preventDefault(); const f=e.target;
  const cid=+f.bc.value, month=f.bm.value, date=f.bd.value, amt=parseFloat(f.ba.value), method=f.bp.value;
  try {
    const inv = await ensureInvoice(cid, month);
    const balance = invPrice(inv) - paid(inv);
    const amount = amt > 0 ? amt : balance;
    if (!(amount > 0)) return toast("That month is already paid in full");
    BM = month;
    await run(db.from("payments").insert({invoice_id:inv.id, amount:Math.round(amount), method, paid_on:date}), money(amount) + " recorded");
  } catch(err){ toast(err.message); }
}
async function markPaid(invId){
  const inv = S.inv.find(i=>i.id===invId);
  const balance = invPrice(inv) - paid(inv);
  if (balance > 0) await run(db.from("payments").insert({invoice_id:invId, amount:balance, method:"Mobile money", paid_on:today()}), "Marked paid in full");
}
async function genInvoices(){
  const rows = S.cust.filter(c=>c.status!=="cancelled").map(c => ({customer_id:c.id, billing_month:BM, status:"Due"}));
  if (!rows.length) return toast("No active customers yet");
  await run(db.from("invoices").upsert(rows, {onConflict:"customer_id,billing_month", ignoreDuplicates:true}), "Invoices generated for " + BM);
}
async function sendMsg(){
  const r = recips();
  if (!r.length || !M.txt.trim()) return toast("Choose a group and write a message first");
  const label = AUD().find(o=>o[0]===M.aud)[1];
  await run(db.from("messages").insert({channel:M.ch, audience:label, recipient_count:r.length, body:M.txt}), "Logged " + r.length + " " + M.ch + " messages");
}

db.auth.onAuthStateChange(async (_event, session) => {
  if (session && session.user.id !== OWNER_ID) {
    setTimeout(() => db.auth.signOut(), 0);
    $("#lg-err").textContent = "This account is not allowed to use the console.";
    return;
  }
  $("#login").hidden = !!session;
  $("#app").hidden = !session;
  if (session){
    $("#who").innerHTML = `<div class="font-semibold">Owner</div><div class="break-all text-xs text-muted">${esc(session.user.email)}</div>`;
    try { await load(); render(); } catch(err){ toast(err.message); }
  }
});
