<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF-TECH Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--surface:#fff;--ink:#10222e;--muted:#52667a;--line:#cfdbe3;--teal:#0f766e;--teal-ink:#fff;--amber:#d97706;--red:#b91c1c;--track:#dbe6ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a22;--surface:#142632;--ink:#e8f1f6;--muted:#9bb0bf;--line:#264152;--teal:#2dd4bf;--teal-ink:#06231f;--amber:#fbbf24;--red:#f87171;--track:#21394a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--surface:#0b0f12;--ink:#e8f1f6;--muted:#9bb0bf;--line:#264152;--teal:#2dd4bf;--teal-ink:#06231f;--amber:#fbbf24;--red:#f87171;--track:#21394a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;font-size:16px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px;flex-wrap:wrap;gap:8px}
h1{font-size:1.4rem;margin:0;letter-spacing:-.02em}
header a{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{font:inherit;font-weight:600;border:2px solid transparent;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--teal);color:var(--teal-ink)}
h2{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k2{grid-template-columns:1fr 1fr}.k5{grid-template-columns:repeat(5,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kpi b{display:block;font-size:1.8rem;letter-spacing:-.03em;line-height:1.1}
.kpi span{color:var(--muted);font-size:.9rem}
.up{color:var(--teal);font-weight:600;font-size:.85rem}
.bar{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar i.w{background:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
button.s,select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:5px 10px}
button.s{cursor:pointer;font-weight:600}
button.p{font:inherit;font-weight:700;background:var(--teal);color:var(--teal-ink);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.badge{font-size:.8rem;font-weight:700;border-radius:6px;padding:2px 8px;border:1.5px solid currentColor}
.ok{color:var(--teal)}.warn{color:var(--amber)}.bad{color:var(--red)}
.col h3{font-size:.95rem;margin:0 0 8px}
.lead{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg);font-size:.9rem}
.lead small{color:var(--muted);display:block;margin-bottom:6px}
form.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
form.add input{flex:1;min-width:140px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media (max-width:860px){.k4,.k2{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.k4,.k2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>SAF-TECH Operations Console</h1><a href="#" id="reset">Reset sample data</a></header>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
var PRICE={Bronze:2000,Silver:2500,Gold:3000,Premium:4500},LS=["New","Contacted","Site survey","Quoted","Won"],CS=["Onboarding","Active","Upsell","At risk"];
var NEXT={"Onboarding":"Confirm install and Wi-Fi setup","Active":"Check-in call at 90 days","Upsell":"Offer a faster plan","At risk":"Call within 48 hours"};
var TABS=["Overview","Leads","Goals","Marketing","Customers","Login details","Tertiary info","Billing","Messages"],tab="Overview";
var MON=["Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct"],SUBS=[2210,2290,2380,2450,2540,2620,2700,2790,2880,2960,3050,3120],TRAF=[4100,4400,4900,5200,5800,6100,6600,7000,7500,7900,8400,9000];
var NODES=[["Nyeri core","Online","99.99%","6 ms"],["Karatina link","Online","99.96%","9 ms"],["Othaya tower","Degraded","99.71%","31 ms"],["Mweiga fiber ring","Online","99.98%","8 ms"],["Naro Moru edge","Online","99.95%","12 ms"]];
function seed(){return{
leads:[{id:1,n:"Mwangi Hardware",s:"Referral",p:"Family",st:0},{id:2,n:"Grace Wanjiru",s:"Social media",p:"Home",st:0},{id:3,n:"Hillview Lodge",s:"Door-to-door",p:"Studio",st:1},{id:4,n:"Peter Kamau",s:"Radio",p:"Home",st:2},{id:5,n:"Sunrise Academy",s:"Partnership",p:"Studio",st:3},{id:6,n:"Esther Njeri",s:"Referral",p:"Family",st:3},{id:7,n:"Baraka Cafe",s:"Google ads",p:"Family",st:4,c:1}],
cust:[{id:1,n:"Baraka Cafe",p:"Family",st:"Onboarding",l:"Oct 20"},{id:2,n:"James Otieno",p:"Home",st:"Active",l:"Sep 12"},{id:3,n:"Nyeri Clinic",p:"Studio",st:"Active",l:"Aug 30"},{id:4,n:"Lucy Wambui",p:"Home",st:"Upsell",l:"Oct 02"},{id:5,n:"Kiambu Traders",p:"Family",st:"At risk",l:"Jul 15"},{id:6,n:"Daniel Mutua",p:"Family",st:"Active",l:"Oct 10"},{id:7,n:"Green Valley School",p:"Studio",st:"Active",l:"Sep 25"},{id:8,n:"Rose Achieng",p:"Home",st:"At risk",l:"Aug 02"}],
inv:[[1,"Paid"],[2,"Paid"],[3,"Due"],[4,"Paid"],[5,"Overdue"],[6,"Due"],[7,"Paid"],[8,"Overdue"]].map(function(x,i){return{id:1001+i,c:x[0],m:"Oct 2026",s:x[1]}}),
goals:[{t:"Reach 4,000 subscribers",c:3120,g:4000,u:""},{t:"Monthly recurring revenue",c:9400000,g:12000000,u:"KSh"},{t:"Cut monthly churn to 1.5% (lower is better)",c:1.8,g:1.5,u:"%",inv:1},{t:"Network uptime",c:99.97,g:99.99,u:"%",min:99},{t:"New customers this quarter",c:96,g:150,u:""}],
mk:[["Referral program",150000,64,41,"Existing customers get one free month for each referral."],["Door-to-door visits",320000,58,22,"Sales team visits streets where fiber has just been laid."],["Social media",230000,92,18,"Short videos and local community groups on Facebook and WhatsApp."],["Radio and posters",280000,40,9,"Local FM spots and posters at shopping centers."],["Google ads",190000,36,11,"Search ads for ‘fiber internet near me’."],["Business partnerships",110000,18,10,"Schools, clinics and landlords who bundle our service."]]};}
var S;try{S=JSON.parse(localStorage.getItem("saf2"))}catch(e){}function fix(){var PM={Home:"Bronze",Family:"Gold",Studio:"Premium",Basic:"Bronze",Standard:"Silver",Plus:"Gold"};S.leads.concat(S.cust).forEach(function(x){if(PM[x.p])x.p=PM[x.p]});S.cust.forEach(function(x,i){if(!x.ph&&!x.sv&&x.id<100){x.ph="0700 000 0"+(10+i);x.sv=i%3===1?"Hotspot":"PPPoE"}});S.inv.forEach(function(i){if(!i.pays){i.pays=[];if(i.s==="Paid"){i.pays.push({d:mp(i.m)+("0"+(2+i.id%20)).slice(-2),a:PRICE[cname(i.c).p]||0,pm:["Mobile money","Cash","Bank transfer"][i.id%3]})}i.s=i.s==="Overdue"?"Overdue":"Due"}});if(!S.h){S.h=1;var mx=1100;S.cust.forEach(function(c){if(c.id<100)["Jun 2026","Jul 2026","Aug 2026","Sep 2026"].forEach(function(m,k){var late=c.st==="At risk"&&k>1,i={id:++mx,c:c.id,m:m,s:late?"Overdue":"Due",pays:[]};if(!late)i.pays.push({d:mp(m)+("0"+(3+(c.id*3+k*2)%22)).slice(-2),a:PRICE[c.p]||0,pm:["Mobile money","Cash","Bank transfer"][(c.id+k)%3]});S.inv.push(i)})})}
S.cust.forEach(function(c){if(c.id<100&&!c.u){c.u=c.n.split(" ")[0].toLowerCase()+(100+c.id*7);c.w="saf"+(2000+c.id*131);c.loc=["Town centre","Industrial area","Hillside estate","Market road"][c.id%4];c.eq="SN"+(48200+c.id*7);c.inst="2026-0"+(c.id%9+1)+"-15"}});
S.msgs=S.msgs||[]}
if(!S||!S.goals)S=seed();fix();
function save(){try{localStorage.setItem("saf2",JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function money(n){return"KSh "+Math.round(n).toLocaleString("en-US")}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
function cname(id){var c=S.cust.filter(function(x){return x.id===id})[0];return c||{n:"Unknown",p:"Home"}}
function chart(){var W=640,H=170,mx=3300,mn=2000,pts=SUBS.map(function(v,i){return(30+i*(W-50)/11).toFixed(1)+","+(H-20-(v-mn)/(mx-mn)*(H-40)).toFixed(1)}).join(" ");
return'<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img" aria-label="Subscribers over 12 months"><polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linejoin="round"/>'+MON.map(function(m,i){return(i%2===0?'<text x="'+(30+i*(W-50)/11)+'" y="'+(H-3)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+m+"</text>":"")}).join("")+"</svg>"}
function bars(){var mx=Math.max.apply(null,TRAF);return TRAF.map(function(v,i){return'<div style="display:flex;align-items:center;gap:8px;font-size:.85rem"><span style="width:28px;color:var(--muted)">'+MON[i]+'</span><div class="bar" style="flex:1"><i style="width:'+v/mx*100+'%"></i></div><span style="width:90px">'+v.toLocaleString("en-US")+" Mbps</span></div>"}).slice(-6).join("")}
var V={
Overview:function(){return'<h2>System analytics</h2><p class="sub">Network and subscriber health for the last 12 months.</p><div class="grid k4"><div class="card kpi"><span>Subscribers</span><b>3,120</b><span class="up">+4.2% this month</span></div><div class="card kpi"><span>Monthly revenue</span><b>KSh 9,400,000</b><span class="up">+3.1%</span></div><div class="card kpi"><span>Monthly churn</span><b>1.8%</b><span class="up">down from 2.2%</span></div><div class="card kpi"><span>Network uptime</span><b>99.97%</b><span>30-day average</span></div></div><div class="grid k2" style="margin-top:14px"><div class="card"><h2 style="font-size:1.05rem">Subscriber growth</h2>'+chart()+'</div><div class="card"><h2 style="font-size:1.05rem">Average traffic, last 6 months</h2><div class="grid" style="gap:8px">'+bars()+'</div></div></div><div class="card scroll" style="margin-top:14px"><h2 style="font-size:1.05rem">Network health</h2><table><tr><th>Site</th><th>Status</th><th>30-day uptime</th><th>Latency</th></tr>'+NODES.map(function(n){return"<tr><td>"+n[0]+'</td><td><span class="badge '+(n[1]==="Online"?"ok":"warn")+'">'+n[1]+"</span></td><td>"+n[2]+"</td><td>"+n[3]+"</td></tr>"}).join("")+"</table></div>"},
Leads:function(){return'<h2>Customer leads</h2><p class="sub">Move each lead along the pipeline. A lead marked Won becomes a customer.</p><form class="add" id="lf"><input id="ln" placeholder="Lead name" aria-label="Lead name" required><select id="ls" aria-label="Source">'+S.mk.map(function(m){return"<option>"+m[0].replace("Referral program","Referral").replace("Door-to-door visits","Door-to-door").replace("Radio and posters","Radio").replace("Business partnerships","Partnership")+"</option>"}).join("")+'</select><select id="lp" aria-label="Plan"><option>Bronze</option><option>Silver</option><option>Gold</option><option>Premium</option></select><button class="p">Add lead</button></form><div class="grid k5" style="overflow-x:auto">'+LS.map(function(st,i){var L=S.leads.filter(function(l){return l.st===i});return'<div class="col card"><h3>'+st+" ("+L.length+")</h3>"+L.map(function(l){return'<div class="lead"><b>'+l.n+"</b><small>"+l.s+" · "+l.p+"</small>"+(i<4?'<button class="s" onclick="adv('+l.id+')">Move to '+LS[i+1]+"</button>":'<span class="ok">Customer</span>')+"</div>"}).join("")+"</div>"}).join("")+"</div>"},
Goals:function(){return'<h2>Company goals</h2><p class="sub">Update the current value as results come in.</p><div class="grid">'+S.goals.map(function(g,i){var p=g.inv?Math.min(100,g.g/g.c*100):(g.min?(g.c-g.min)/(g.g-g.min)*100:g.c/g.g*100);p=Math.max(0,Math.min(100,p));return'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>'+g.t+'</b><span>Target: '+(g.u==="KSh"?"KSh ":"")+g.g.toLocaleString("en-US")+(g.u==="%"?"%":"")+'</span></div><div class="bar" style="margin:10px 0"><i class="'+(p<60?"w":"")+'" style="width:'+p+'%"></i></div><label>Current: <input type="number" step="any" value="'+g.c+'" style="width:130px" onchange="setg('+i+',this.value)"></label> <span class="'+(p>=90?"ok":"warn")+'">'+Math.round(p)+"% there</span></div>"}).join("")+"</div>"},
Marketing:function(){var T=S.mk.map(function(m){return{n:m[0],sp:m[1],ld:m[2],w:m[3],d:m[4],cpc:m[1]/m[3]}}),best=T.slice().sort(function(a,b){return a.cpc-b.cpc})[0],mx=Math.max.apply(null,T.map(function(t){return t.w}));return'<h2>Marketing methods</h2><p class="sub">Monthly spend and results per channel. The lowest cost per customer is highlighted.</p><div class="card scroll"><table><tr><th>Method</th><th>How we do it</th><th>Spend</th><th>Leads</th><th>Customers</th><th>Cost per customer</th></tr>'+T.map(function(t){return"<tr"+(t===best?' style="background:var(--track)"':"")+"><td><b>"+t.n+"</b></td><td>"+t.d+"</td><td>"+money(t.sp)+"</td><td>"+t.ld+"</td><td>"+t.w+"</td><td>"+money(t.cpc)+"</td></tr>"}).join("")+'</table></div><div class="card" style="margin-top:14px"><h2 style="font-size:1.05rem">Customers won by method</h2><div class="grid" style="gap:8px;margin-top:10px">'+T.map(function(t){return'<div style="display:flex;align-items:center;gap:8px;font-size:.88rem"><span style="width:150px">'+t.n+'</span><div class="bar" style="flex:1"><i style="width:'+t.w/mx*100+'%"></i></div><span>'+t.w+"</span></div>"}).join("")+"</div></div>"},
Messages:function(){var r=recips(),a=AUD();return'<h2>Messages</h2><p class="sub">Send an SMS or WhatsApp message to a group of customers. Type {name}, {package} or {amount} to personalize each message.</p><div class="grid k2"><div class="card"><div class="grid" style="gap:12px"><label>Send to<br><select style="width:100%" onchange="M.aud=this.value;render()">'+a.map(function(o){return'<option value="'+o[0]+'"'+(o[0]===M.aud?" selected":"")+'>'+o[1]+"</option>"}).join("")+'</select></label><label>Channel<br><select style="width:100%" onchange="M.ch=this.value;render()">'+["SMS","WhatsApp"].map(function(c){return"<option"+(c===M.ch?" selected":"")+">"+c+"</option>"}).join("")+'</select></label><label>Template<br><select style="width:100%" onchange="tpl(this.value)"><option value="">Choose a template</option>'+Object.keys(TPL).map(function(k){return"<option>"+k+"</option>"}).join("")+'</select></label><label>Message<br><textarea rows="5" style="width:100%" oninput="M.txt=this.value;upd()">'+esc(M.txt)+'</textarea></label><div><button class="p" onclick="sendm()">Send to '+r.length+' customers</button></div></div></div><div class="card"><h2 style="font-size:1.05rem">Preview</h2><p id="pv" style="white-space:pre-wrap"></p><p class="sub" id="cc"></p><p class="sub">Messages are logged here. Automatic delivery needs an SMS gateway, so for now use the Open links below to send from your own phone.</p></div></div><div class="card scroll" style="margin-top:14px"><h2 style="font-size:1.05rem">Recipients ('+r.length+')</h2><table><tr><th>Customer</th><th>Phone</th><th>Package</th><th></th></tr>'+(r.length?r.map(function(c){var l=mlink(c);return"<tr><td>"+c.n+"</td><td>"+(c.ph||"-")+"</td><td>"+c.p+"</td><td>"+(l?'<a href="'+l+'" target="_blank" rel="noopener">Open in '+M.ch+"</a>":"No phone number")+"</td></tr>"}).join(""):'<tr><td colspan="4">No customers match this group.</td></tr>')+'</table></div><div class="card scroll" style="margin-top:14px"><h2 style="font-size:1.05rem">Sent messages</h2><table><tr><th>When</th><th>Channel</th><th>Group</th><th>Customers</th><th>Message</th></tr>'+(S.msgs.length?S.msgs.slice().reverse().map(function(m){return"<tr><td>"+m.t+"</td><td>"+m.ch+"</td><td>"+m.a+"</td><td>"+m.n+"</td><td>"+esc(m.x.slice(0,70))+"</td></tr>"}).join(""):'<tr><td colspan="5">No messages sent yet.</td></tr>')+"</table></div>"},
Customers:function(){var c={};CS.forEach(function(s){c[s]=S.cust.filter(function(x){return x.st===s}).length});return'<h2>Customer development</h2><p class="sub">Track every customer from install to upgrade, and spot who needs a call.</p><div class="grid k4" style="margin-bottom:14px">'+CS.map(function(s){return'<div class="card kpi"><span>'+s+"</span><b>"+c[s]+"</b></div>"}).join("")+'</div><form class="add card" id="cf"><b style="width:100%">Add a customer</b><input id="cn" placeholder="Customer name" aria-label="Customer name" required><input id="cph" type="tel" placeholder="Phone, e.g. 0712 345 678" aria-label="Phone number" required><input id="cem" type="email" placeholder="Email (optional)" aria-label="Email"><select id="cp" aria-label="Package">'+Object.keys(PRICE).map(function(k){return"<option>"+k+"</option>"}).join("")+'</select><select id="cs" aria-label="Service type"><option>PPPoE</option><option>Hotspot</option></select><button class="p">Add customer</button></form><div class="card scroll"><table><tr><th>Customer</th><th>Contact</th><th>Package</th><th>Service</th><th>Stage</th><th>Last contact</th><th>Next step</th><th></th></tr>'+S.cust.map(function(x){return"<tr><td><b>"+x.n+"</b></td><td>"+(x.ph||"-")+(x.em?"<br><small>"+x.em+"</small>":"")+"</td><td>"+x.p+" · KSh "+(PRICE[x.p]||0).toLocaleString("en-US")+"</td><td><span class='badge ok'>"+(x.sv||"PPPoE")+"</span>"+'</td><td><select aria-label="Stage for '+x.n+'" onchange="setc('+x.id+',this.value)">'+CS.map(function(s){return"<option"+(s===x.st?" selected":"")+">"+s+"</option>"}).join("")+"</select></td><td>"+x.l+"</td><td>"+NEXT[x.st]+'</td><td><button class="s" onclick="logc('+x.id+')">Log contact</button> <button class="s" style="color:var(--red)" onclick="delc('+x.id+')">'+(dc===x.id?"Confirm delete":"Delete")+'</button></td></tr>'}).join("")+"</table></div>"},
Billing:function(){var a=0,pd=0,od=0;S.inv.forEach(function(i){var m=PRICE[cname(i.c).p];a+=m;if(i.s==="Paid")pd+=m;if(i.s==="Overdue")od+=m});return'<h2>Billing</h2><p class="sub">Invoices for every customer. Mark payments as they arrive and send reminders.</p><div class="grid k4" style="margin-bottom:14px"><div class="card kpi"><span>Billed</span><b>'+money(a)+'</b></div><div class="card kpi"><span>Collected</span><b class="ok">'+money(pd)+'</b></div><div class="card kpi"><span>Outstanding</span><b>'+money(a-pd)+'</b></div><div class="card kpi"><span>Overdue</span><b class="bad">'+money(od)+'</b></div></div><p><button class="p" onclick="gen()">Generate Nov 2026 invoices</button></p><div class="card scroll"><table><tr><th>Invoice</th><th>Customer</th><th>Plan</th><th>Period</th><th>Amount</th><th>Status</th><th></th></tr>'+S.inv.slice().reverse().map(function(i){var c=cname(i.c);return"<tr><td>#"+i.id+"</td><td>"+c.n+"</td><td>"+c.p+"</td><td>"+i.m+"</td><td>"+money(PRICE[c.p])+'</td><td><span class="badge '+(i.s==="Paid"?"ok":i.s==="Due"?"warn":"bad")+'">'+i.s+"</span></td><td>"+(i.s==="Paid"?"":'<button class="s" onclick="pay('+i.id+')">Mark paid</button> <button class="s" onclick="rem('+i.id+')">Remind</button>')+"</td></tr>"}).join("")+"</table></div>"}};
var MO=["Jun 2026","Jul 2026","Aug 2026","Sep 2026","Oct 2026","Nov 2026"],BM="Oct 2026",MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function mp(m){var a=m.split(" "),N=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return a[1]+"-"+("0"+(N.indexOf(a[0])+1)).slice(-2)+"-"}
function paid(i){return(i.pays||[]).reduce(function(a,p){return a+p.a},0)}
function price(i){return PRICE[cname(i.c).p]||0}
function ist(i){var p=paid(i);return p>=price(i)?"Paid":p>0?"Partial":(i.s==="Overdue"?"Overdue":"Due")}
function bcl(s){return s==="Paid"?"ok":s==="Overdue"?"bad":"warn"}
function fd(d,y){return new Date(d+"T00:00:00").toLocaleDateString("en-GB",y?{day:"numeric",month:"short",year:"numeric"}:{day:"numeric",month:"short"})}
function invf(c,m){return S.inv.filter(function(i){return i.c===c&&i.m===m})[0]}
function nid(){return S.inv.reduce(function(a,i){return Math.max(a,i.id)},1000)+1}
function today(){return new Date().toISOString().slice(0,10)}
function recpay(){var c=+$("#bc").value,m=$("#bm").value,d=$("#bd").value,amt=parseFloat($("#ba").value),pm=$("#bp").value;if(!c||!d){toast("Choose a customer and a date");return}var i=invf(c,m);if(!i){i={id:nid(),c:c,m:m,s:"Due",pays:[]};S.inv.push(i)}if(!i.pays)i.pays=[];var b=price(i)-paid(i);if(!(amt>0))amt=b;if(amt<=0){toast("That month is already paid in full");return}i.pays.push({d:d,a:amt,pm:pm});BM=m;save();render();toast(money(amt)+" recorded for "+cname(c).n)}
function payfull(id){var i=S.inv.filter(function(x){return x.id===id})[0],b=price(i)-paid(i);if(b>0){i.pays=i.pays||[];i.pays.push({d:today(),a:b,pm:"Mobile money"});save();render();toast("Payment recorded for "+cname(i.c).n)}}
function genm(){var n=0;S.cust.forEach(function(c){if(!invf(c.id,BM)){S.inv.push({id:nid(),c:c.id,m:BM,s:"Due",pays:[]});n++}});save();render();toast(n?n+" invoices created for "+BM:"Invoices for "+BM+" already exist")}
V.Billing=function(){var I=S.inv.filter(function(i){return i.m===BM}),bl=0,cl=0,od=0,h=[];
I.forEach(function(i){var p=price(i),q=Math.min(p,paid(i));bl+=p;cl+=q;if(ist(i)==="Overdue")od+=p-q});
S.inv.forEach(function(i){(i.pays||[]).forEach(function(p){h.push({n:cname(i.c).n,m:i.m,d:p.d,a:p.a,pm:p.pm})})});
h.sort(function(a,b){return a.d<b.d?1:-1});
var mo=MO.map(function(m){return'<option'+(m===BM?' selected':'')+'>'+m+'</option>'}).join('');
return'<h2>Billing</h2><p class="sub">Record each payment against a customer and a month. Totals, the monthly tracker and the payment history update straight away.</p>'
+'<p><label>Month <select onchange="BM=this.value;render()">'+mo+'</select></label> <button class="s" onclick="genm()">Generate invoices for '+BM+'</button></p>'
+'<div class="grid k4" style="margin-bottom:14px"><div class="card kpi"><span>Billed in '+BM+'</span><b>'+money(bl)+'</b></div><div class="card kpi"><span>Collected</span><b class="ok">'+money(cl)+'</b><span>'+(bl?Math.round(cl/bl*100):0)+'% of billed</span></div><div class="card kpi"><span>Outstanding</span><b>'+money(bl-cl)+'</b></div><div class="card kpi"><span>Overdue</span><b class="bad">'+money(od)+'</b></div></div>'
+'<form class="add card" id="pf"><b style="width:100%">Record a payment</b><select id="bc" aria-label="Customer">'+S.cust.map(function(c){return'<option value="'+c.id+'">'+c.n+'</option>'}).join('')+'</select><select id="bm" aria-label="Month paid for">'+mo+'</select><input id="bd" type="date" aria-label="Date of payment" value="'+today()+'" required><input id="ba" type="number" min="1" placeholder="Amount (blank = full balance)" aria-label="Amount" style="min-width:220px"><select id="bp" aria-label="Payment method"><option>Mobile money</option><option>Cash</option><option>Bank transfer</option></select><button class="p">Record payment</button></form>'
+'<div class="card scroll"><h2 style="font-size:1.05rem">Invoices for '+BM+'</h2><table><tr><th>Invoice</th><th>Customer</th><th>Package</th><th>Billed</th><th>Paid</th><th>Balance</th><th>Status</th><th>Last payment</th><th></th></tr>'+(I.length?I.map(function(i){var c=cname(i.c),p=price(i),q=paid(i),s=ist(i),l=(i.pays||[]).slice(-1)[0];return'<tr><td>#'+i.id+'</td><td><b>'+c.n+'</b></td><td>'+c.p+'</td><td>'+money(p)+'</td><td>'+money(q)+'</td><td>'+money(Math.max(0,p-q))+'</td><td><span class="badge '+bcl(s)+'">'+s+'</span></td><td>'+(l?fd(l.d,1):'-')+'</td><td>'+(s==='Paid'?'':'<button class="s" onclick="payfull('+i.id+')">Mark paid in full</button>')+'</td></tr>'}).join(''):'<tr><td colspan="9">No invoices for this month yet. Use Generate invoices.</td></tr>')+'</table></div>'
+'<div class="card scroll" style="margin-top:14px"><h2 style="font-size:1.05rem">Monthly payment tracker</h2><table><tr><th>Customer</th>'+MO.map(function(m){return'<th>'+m+'</th>'}).join('')+'<th>Total paid</th><th>Balance owed</th></tr>'+S.cust.map(function(c){var tp=0,bo=0,cells=MO.map(function(m){var i=invf(c.id,m);if(!i)return'<td style="color:var(--muted)">-</td>';var s=ist(i),l=(i.pays||[]).slice(-1)[0],p=price(i),q=paid(i);tp+=q;bo+=Math.max(0,p-q);return'<td><span class="badge '+bcl(s)+'">'+s+'</span>'+(l?'<br><small>'+fd(l.d)+'</small>':'')+'</td>'}).join('');return'<tr><td><b>'+c.n+'</b></td>'+cells+'<td>'+money(tp)+'</td><td>'+money(bo)+'</td></tr>'}).join('')+'</table></div>'
+'<div class="card scroll" style="margin-top:14px"><h2 style="font-size:1.05rem">Payment history</h2><table><tr><th>Date paid</th><th>Customer</th><th>Month</th><th>Amount</th><th>Method</th></tr>'+(h.length?h.slice(0,15).map(function(x){return'<tr><td>'+fd(x.d,1)+'</td><td>'+x.n+'</td><td>'+x.m+'</td><td>'+money(x.a)+'</td><td>'+x.pm+'</td></tr>'}).join(''):'<tr><td colspan="5">No payments recorded yet.</td></tr>')+'</table></div>'};
function ea(s){return esc(s).split('"').join("&quot;")}
function mku(n){return n.split(" ")[0].toLowerCase()+Math.floor(100+Math.random()*900)}
function mkw(){var c="abcdefghjkmnpqrstuvwxyz23456789",s="";for(var i=0;i<8;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s}
var SH=0,K=["loc","idn","alt","inst","eq","nt"];
function setu(id,v){cname(id).u=v;save();toast("Saved")}
function setw(id,v){cname(id).w=v;save();toast("Saved")}
function setk(id,i,v){cname(id)[K[i]]=v;save();toast("Saved")}
function genl(id){var c=cname(id);c.u=c.u||mku(c.n);c.w=mkw();save();render();toast("New password generated")}
var TF=[["Location","loc","text","Area or street"],["ID number","idn","text","National ID"],["Alternate contact","alt","text","Name and phone"],["Installed on","inst","date",""],["Equipment serial","eq","text","Router or ONT serial"],["Notes","nt","text","Anything else"]];
V["Login details"]=function(){return'<h2>Login details</h2><p class="sub">Connection logins for each customer: the PPPoE username and password, or the Hotspot voucher code. Edit a field and it saves automatically.</p><p><button class="s" onclick="SH=!SH;render()">'+(SH?"Hide":"Show")+' passwords</button></p><div class="card scroll"><table><tr><th>Customer</th><th>Service</th><th>Username or voucher</th><th>Password</th><th></th></tr>'+S.cust.map(function(c){return'<tr><td><b>'+c.n+'</b></td><td><span class="badge ok">'+(c.sv||"PPPoE")+'</span></td><td><input value="'+ea(c.u||"")+'" aria-label="Username for '+c.n+'" onchange="setu('+c.id+',this.value)"></td><td><input type="'+(SH?"text":"password")+'" value="'+ea(c.w||"")+'" aria-label="Password for '+c.n+'" onchange="setw('+c.id+',this.value)"></td><td><button class="s" onclick="genl('+c.id+')">'+(c.w?"New password":"Generate")+'</button></td></tr>'}).join('')+'</table></div><p class="sub" style="margin-top:12px">Passwords are stored only in this browser. Do not keep real customer passwords here.</p>'};
V["Tertiary info"]=function(){return'<h2>Tertiary information</h2><p class="sub">Extra details kept on each customer: location, ID, an alternate contact, installation date, equipment and notes. Edit a field and it saves automatically.</p><div class="card scroll"><table><tr><th>Customer</th>'+TF.map(function(f){return'<th>'+f[0]+'</th>'}).join('')+'</tr>'+S.cust.map(function(c){return'<tr><td><b>'+c.n+'</b></td>'+TF.map(function(f,i){return'<td><input type="'+f[2]+'" value="'+ea(c[f[1]]||"")+'" placeholder="'+f[3]+'" aria-label="'+f[0]+' for '+c.n+'" onchange="setk('+c.id+','+i+',this.value)" style="min-width:140px"></td>'}).join('')+'</tr>'}).join('')+'</table></div>'};
function render(){$("#tabs").innerHTML=TABS.map(function(t){return'<button role="tab" aria-selected="'+(t===tab)+'" onclick="go(\''+t+"')\">"+t+"</button>"}).join("");$("#view").innerHTML=V[tab]();if(tab==="Messages")upd();var f=$("#lf");if(f)f.onsubmit=function(e){e.preventDefault();S.leads.push({id:Date.now(),n:$("#ln").value.trim(),s:$("#ls").value,p:$("#lp").value,st:0});save();render();toast("Lead added")};var g=$("#cf");if(g)g.onsubmit=function(e){e.preventDefault();addc()};var q=$("#pf");if(q)q.onsubmit=function(e){e.preventDefault();recpay()}}
function go(t){tab=t;render()}
function adv(id){var l=S.leads.filter(function(x){return x.id===id})[0];l.st++;if(l.st===4&&!l.c){l.c=1;S.cust.push({id:Date.now(),n:l.n,p:l.p,st:"Onboarding",l:"Today"});toast(l.n+" is now a customer")}save();render()}
function setg(i,v){S.goals[i].c=parseFloat(v)||0;save();render()}
function setc(id,v){cname(id).st=v;save();render()}
var TPL={"Billing reminder":"Hello {name}, your {package} bill of {amount} is due. Please pay before the due date to avoid disconnection. Thank you, SAF-TECH.","Service outage":"Hello {name}, we are fixing a network fault in your area and service will be restored shortly. We apologize for the inconvenience. SAF-TECH.","Upgrade offer":"Hello {name}, upgrade from {package} to a faster package this month and get your first week free. Reply YES to upgrade. SAF-TECH.","Welcome":"Welcome to SAF-TECH, {name}! Your {package} package is being set up and our technician will contact you shortly."};
var M={aud:"all",ch:"SMS",txt:TPL["Service outage"]};
function esc(s){return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;")}
function AUD(){return[["all","All customers"]].concat(CS.map(function(s){return["st:"+s,"Stage: "+s]}),Object.keys(PRICE).map(function(p){return["pl:"+p,"Package: "+p]}),[["sv:PPPoE","Service: PPPoE"],["sv:Hotspot","Service: Hotspot"],["unpaid","Customers with unpaid invoices"]])}
function recips(){var a=M.aud;return S.cust.filter(function(x){if(a==="all")return 1;var k=a.split(":");if(k[0]==="st")return x.st===k[1];if(k[0]==="pl")return x.p===k[1];if(k[0]==="sv")return(x.sv||"PPPoE")===k[1];return S.inv.some(function(i){return i.c===x.id&&ist(i)!=="Paid"})})}
function mg(t,x){return t.split("{name}").join(x.n.split(" ")[0]).split("{package}").join(x.p).split("{amount}").join("KSh "+(PRICE[x.p]||0).toLocaleString("en-US"))}
function mlink(x){var d=(x.ph||"").split(" ").join("").split("-").join("");if(!d)return"";if(d.charAt(0)==="0")d="254"+d.slice(1);var t=encodeURIComponent(mg(M.txt,x));return M.ch==="SMS"?"sms:+"+d+"?body="+t:"https://wa.me/"+d+"?text="+t}
function upd(){var r=recips(),n=M.txt.length;$("#pv").textContent=r.length?mg(M.txt,r[0]):"No customers match this group.";$("#cc").textContent=n+" characters"+(M.ch==="SMS"?" \u00b7 "+Math.max(1,Math.ceil(n/160))+" SMS per customer":"")+(r.length?" \u00b7 preview for "+r[0].n:"")}
function tpl(k){if(TPL[k]){M.txt=TPL[k];render()}}
function sendm(){var r=recips();if(!r.length||!M.txt.trim()){toast("Choose a group and write a message first");return}var a=AUD().filter(function(o){return o[0]===M.aud})[0][1];S.msgs.push({t:new Date().toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),ch:M.ch,a:a,n:r.length,x:M.txt});save();render();toast("Logged "+r.length+" "+M.ch+" messages")}
var dc=0;
function addc(){var n=$("#cn").value.trim(),ph=$("#cph").value.trim();if(!n||!ph)return;S.cust.push({id:Date.now(),n:n,ph:ph,em:$("#cem").value.trim(),p:$("#cp").value,sv:$("#cs").value,st:"Onboarding",l:"Today",u:mku(n),w:mkw()});save();render();toast(n+" added")}
function delc(id){if(dc!==id){dc=id;render();toast("Click Delete again to confirm");return}var n=cname(id).n;S.cust=S.cust.filter(function(x){return x.id!==id});S.inv=S.inv.filter(function(i){return i.c!==id});dc=0;save();render();toast(n+" deleted")}
function logc(id){cname(id).l="Today";save();render();toast("Contact logged")}
function pay(id){S.inv.forEach(function(i){if(i.id===id)i.s="Paid"});save();render();toast("Payment recorded")}
function rem(id){toast("Reminder sent for invoice #"+id)}
function gen(){var n=0,m=S.inv.reduce(function(a,i){return Math.max(a,i.id)},1000);S.cust.forEach(function(c){if(!S.inv.some(function(i){return i.c===c.id&&i.m==="Nov 2026"})){S.inv.push({id:++m,c:c.id,m:"Nov 2026",s:"Due"});n++}});save();render();toast(n?n+" invoices created":"All invoices already exist")}
$("#reset").onclick=function(e){e.preventDefault();S=seed();fix();save();render();toast("Sample data restored")};
render();
</script>
</body>
</html>
